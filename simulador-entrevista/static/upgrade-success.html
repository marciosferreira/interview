<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to Hunter — Acing Interview</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Styles -->
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  
  <style>
    body {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 24px;
      min-height: 100dvh;
    }
    .success-card {
      background: var(--bg-surface); border: 1px solid var(--status-success-border);
      border-radius: var(--radius-xl); padding: 48px 40px;
      max-width: 480px; width: 100%; text-align: center;
      box-shadow: 0 20px 40px -10px rgba(16, 185, 129, 0.15);
      position: relative; overflow: hidden;
    }
    .success-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
      background: var(--status-success);
    }
    
    .icon-wrapper {
      width: 80px; height: 80px; border-radius: 50%;
      background: var(--status-success-bg); border: 1px solid var(--status-success-border);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px; color: var(--status-success);
    }
    
    h1 { font-size: 28px; font-weight: 800; color: var(--text-primary); margin-bottom: 12px; }
    p { font-size: 15px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 32px; }
    
    .status-note { font-size: 13px; color: var(--text-tertiary); margin-top: 24px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  </style>
  <!-- TikTok Pixel -->
  <script>
  !function(w,d,t){w.TiktokAnalyticsObject=t;var ttq=w[t]=w[t]||[];ttq.methods=["page","track","identify","instances","debug","on","off","once","ready","alias","group","enableCookie","disableCookie","holdConsent","revokeConsent","grantConsent"],ttq.setAndDefer=function(t,e){t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}};for(var i=0;i<ttq.methods.length;i++)ttq.setAndDefer(ttq,ttq.methods[i]);ttq.instance=function(t){for(var e=ttq._i[t]||[],n=0;n<ttq.methods.length;n++)ttq.setAndDefer(e,ttq.methods[n]);return e},ttq.load=function(e,n){var r="https://analytics.tiktok.com/i18n/pixel/events.js",o=n&&n.partner;ttq._i=ttq._i||{},ttq._i[e]=[],ttq._i[e]._u=r,ttq._t=ttq._t||{},ttq._t[e]=+new Date,ttq._o=ttq._o||{},ttq._o[e]=n||{};n=document.createElement("script");n.type="text/javascript",n.async=!0,n.src=r+"?sdkid="+e+"&lib="+t;e=document.getElementsByTagName("script")[0];e.parentNode.insertBefore(n,e)};ttq.load('D7V9SJRC77U4TTGIK5I0');ttq.page({content_id:'acinginterviews'})}(window,document,'ttq');
  </script>
</head>
<body>
<div class="success-card">
  <div class="icon-wrapper">
    <i data-lucide="target" style="width:40px;height:40px;"></i>
  </div>
  <h1>You're a Hunter now!</h1>
  <p>Payment confirmed. Your plan has been upgraded to <strong>Hunter</strong> — 15 interview sessions per week and full AI scorecard access are now unlocked.</p>
  <a class="btn btn-primary" href="/onboarding.html" style="width: 100%; padding: 14px; font-size: 16px;">Start an interview &rarr;</a>
  <p class="status-note" id="status-note"><span class="spinner" style="border-color:rgba(16, 185, 129, 0.3); border-top-color:var(--status-success);"></span> Syncing your account...</p>
</div>

<script>
  lucide.createIcons();

  (async () => {
    const token = localStorage.getItem('auth_token');
    if (!token) {
      document.getElementById('status-note').innerHTML = '';
      return;
    }
    // Poll until plan becomes hunter (webhook may take a few seconds)
    for (let i = 0; i < 10; i++) {
      await new Promise(r => setTimeout(r, 1500));
      try {
        const res  = await fetch('/auth/usage', { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();
        if (data.plan === 'hunter') {
          try {
            const u = JSON.parse(localStorage.getItem('auth_user') || 'null');
            if (u) { u.plan = 'hunter'; localStorage.setItem('auth_user', JSON.stringify(u)); }
          } catch {}
          document.getElementById('status-note').innerHTML = '<i data-lucide="check-circle" style="width:14px;height:14px;color:var(--status-success)"></i> Account synced';
          lucide.createIcons();
          return;
        }
      } catch {}
    }
    document.getElementById('status-note').innerHTML = '<i data-lucide="info" style="width:14px;height:14px;color:var(--brand-primary)"></i> Plan will activate shortly — refresh if needed.';
    lucide.createIcons();
  })();
</script>
</body>
</html>
