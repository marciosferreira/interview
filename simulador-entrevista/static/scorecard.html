<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scorecard — Acing Interviews</title>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">

  <script src="/i18n.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    main {
      flex: 1;
      padding: 40px 24px;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
    }

    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; color: var(--text-secondary); text-decoration: none;
      margin-bottom: 28px; transition: color 0.2s;
    }
    .back-link:hover { color: var(--brand-primary); }

    .page-title {
      font-size: 24px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px;
    }
    .page-sub {
      font-size: 14px; color: var(--text-secondary); margin-bottom: 32px;
    }

    /* Loading */
    #loading-spinner {
      display: flex; justify-content: center; align-items: center; height: 200px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Scorecard content */
    #scorecard-content {
      display: none;
    }

    .scorecard-pre {
      background: var(--bg-surface);
      border: 1px solid var(--bg-surface-border);
      border-radius: var(--radius-md);
      padding: 28px 32px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      line-height: 1.75;
      color: var(--text-primary);
      word-break: break-word;
      overflow-x: auto;
    }

    /* Markdown rendered content */
    .scorecard-pre h1 { font-size: 22px; font-weight: 700; margin: 0 0 20px; color: var(--text-primary); }
    .scorecard-pre h2 { font-size: 17px; font-weight: 600; margin: 28px 0 12px; color: var(--text-primary); }
    .scorecard-pre h3 { font-size: 15px; font-weight: 600; margin: 20px 0 8px; color: var(--text-secondary); }
    .scorecard-pre p  { margin: 0 0 10px; }
    .scorecard-pre ul, .scorecard-pre ol { padding-left: 20px; margin: 6px 0 12px; }
    .scorecard-pre li { margin-bottom: 4px; }
    .scorecard-pre hr { border: none; border-top: 1px solid var(--bg-surface-border); margin: 20px 0; }
    .scorecard-pre blockquote {
      border-left: 3px solid var(--brand-primary);
      padding: 8px 16px;
      margin: 12px 0;
      color: var(--text-secondary);
      background: rgba(99,102,241,0.06);
      border-radius: 0 6px 6px 0;
    }
    .scorecard-pre table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 13px; }
    .scorecard-pre th, .scorecard-pre td {
      border: 1px solid var(--bg-surface-border);
      padding: 8px 12px;
      text-align: left;
    }
    .scorecard-pre th { background: rgba(99,102,241,0.08); font-weight: 600; }
    .scorecard-pre strong { font-weight: 600; color: var(--text-primary); }

    /* TTS toolbar */
    .tts-toolbar { margin-bottom: 16px; }
    #tts-btn .tts-icon { transition: transform 0.4s linear; }
    #tts-btn.playing .tts-icon { animation: spin 1.2s linear infinite; }

    /* Error state */
    #error-state {
      display: none;
      text-align: center;
      padding: 80px 24px;
    }
    .error-icon {
      width: 64px; height: 64px; margin: 0 auto 24px;
      color: var(--text-tertiary); background: var(--bg-surface);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
    }
    .error-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: var(--text-primary); }
    .error-sub   { font-size: 15px; color: var(--text-secondary); margin-bottom: 24px; }

    /* Hire signal hero */
    .hire-hero {
      display: none;
      border-radius: var(--radius-md);
      padding: 28px 32px;
      margin-bottom: 24px;
      text-align: center;
    }
    .hire-hero.signal-strong-yes { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); }
    .hire-hero.signal-yes        { background: rgba(99,102,241,0.1); border: 1px solid rgba(99,102,241,0.3); }
    .hire-hero.signal-borderline { background: rgba(234,179,8,0.1);  border: 1px solid rgba(234,179,8,0.3); }
    .hire-hero.signal-not-yet    { background: rgba(239,68,68,0.1);  border: 1px solid rgba(239,68,68,0.3); }
    .hire-emoji { font-size: 36px; margin-bottom: 8px; }
    .hire-label { font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; opacity: 0.7; }
    .hire-value { font-size: 26px; font-weight: 800; }
    .hire-hero.signal-strong-yes .hire-value { color: #22c55e; }
    .hire-hero.signal-yes        .hire-value { color: var(--brand-primary); }
    .hire-hero.signal-borderline .hire-value { color: #eab308; }
    .hire-hero.signal-not-yet    .hire-value { color: #ef4444; }

    /* Paywall state */
    #paywall-state {
      display: none;
      text-align: center;
      padding: 60px 24px;
    }
    .paywall-icon {
      width: 64px; height: 64px; margin: 0 auto 24px;
      color: var(--brand-primary); background: rgba(99,102,241,0.1);
      border: 1px solid rgba(99,102,241,0.2);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
    }
    .paywall-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: var(--text-primary); }
    .paywall-sub   { font-size: 15px; color: var(--text-secondary); margin-bottom: 28px; max-width: 400px; margin-left: auto; margin-right: auto; }
  </style>

  <script src="/tiktok-pixel.js"></script>
</head>
<body>

<!-- Global Header -->
<header class="app-header">
  <a class="header-brand-link" href="/">
    <div class="header-logo"><i data-lucide="target" style="width: 22px; height: 22px;"></i></div>
    <div class="header-brand-info">
      <h1>Acing Interviews</h1>
      <p>Scorecard</p>
    </div>
  </a>

  <div class="header-actions">
    <span id="plan-pill" class="badge"></span>
    <a href="/history.html" class="btn btn-secondary" style="padding: 6px 12px; font-size: 13px;">
      <i data-lucide="history" style="width:16px;height:16px"></i>
      <span data-i18n="history.header.tagline">Interview history</span>
    </a>
    <a href="/profile.html" class="nav-link"><i data-lucide="settings" style="width:16px;height:16px;"></i> <span data-i18n="nav.settingsLabel">Settings</span></a>
  </div>

  <button class="mobile-menu-btn" id="hamburger-btn" aria-label="Menu"><i data-lucide="menu"></i></button>
</header>

<div id="mobile-drawer">
  <div class="drawer-backdrop" onclick="closeMobileMenu()"></div>
  <nav class="drawer-panel">
    <div class="drawer-header">
      <span>Menu</span>
      <button class="drawer-close" onclick="closeMobileMenu()"><i data-lucide="x"></i></button>
    </div>
    <a class="drawer-item" href="/"><i data-lucide="home"></i> <span data-i18n="nav.homeLabel">Home</span></a>
    <a class="drawer-item" href="/history.html"><i data-lucide="history"></i> <span data-i18n="history.header.tagline">Interview history</span></a>
    <a class="drawer-item" href="/profile.html"><i data-lucide="settings"></i> <span data-i18n="nav.settingsLabel">Settings</span></a>
  </nav>
</div>

<main>
  <a href="/history.html" class="back-link">
    <i data-lucide="arrow-left" style="width:14px;height:14px"></i>
    <span data-i18n="history.header.tagline">Interview history</span>
  </a>

  <div id="loading-spinner">
    <div style="width:36px;height:36px;border:3px solid var(--border-color,#2a2d3e);border-top-color:var(--brand-primary,#6366f1);border-radius:50%;animation:spin 0.8s linear infinite;"></div>
  </div>

  <div id="scorecard-content">
    <div class="page-title" id="scorecard-title">Scorecard</div>
    <div class="page-sub" id="scorecard-sub"></div>

    <div class="hire-hero" id="hire-hero">
      <div class="hire-emoji" id="hire-emoji"></div>
      <div class="hire-label" data-i18n="scorecard.hireLabel">Hiring signal</div>
      <div class="hire-value" id="hire-value"></div>
    </div>

    <div class="tts-toolbar" style="display:flex;gap:8px;align-items:center;">
      <button id="tts-btn" class="btn" onclick="toggleTTS()" style="font-size:13px; padding:6px 14px; background:#d97706; color:#fff; border:none; font-weight:600;">
        <i data-lucide="volume-2" class="tts-icon" style="width:15px;height:15px"></i>
        <span class="tts-label" data-i18n="interview.tts.readScorecard">Ler Scorecard</span>
      </button>
      <button id="tts-stop-btn" class="btn btn-secondary" onclick="stopTTS()" style="font-size:13px; padding:6px 14px; display:none;">
        <i data-lucide="square" style="width:15px;height:15px"></i>
        <span data-i18n="interview.tts.stop">Parar</span>
      </button>
    </div>
    <div class="scorecard-pre" id="scorecard-body"></div>
  </div>

  <div id="paywall-state">
    <div class="paywall-icon"><i data-lucide="lock" style="width:28px;height:28px"></i></div>
    <div class="paywall-title" data-i18n="scorecard.paywall.title">Hunter plan required</div>
    <div class="paywall-sub" data-i18n="scorecard.paywall.sub">Upgrade to Hunter to unlock the full scorecard and hiring signal for every completed interview.</div>
    <a href="/upgrade.html" class="btn btn-primary" data-i18n="scorecard.paywall.cta">Upgrade to Hunter →</a>
  </div>

  <div id="error-state">
    <div class="error-icon"><i data-lucide="file-x" style="width:28px;height:28px"></i></div>
    <div class="error-title" id="error-title"></div>
    <div class="error-sub" id="error-sub"></div>
    <a href="/history.html" class="btn btn-secondary" data-i18n="scorecard.error.backToHistory">Back to history</a>
  </div>
</main>

<script>
  lucide.createIcons();

  const _authToken = localStorage.getItem('auth_token');
  if (!_authToken) {
    const threadId = location.pathname.split('/').pop();
    location.replace('/login.html?next=/scorecard/' + threadId);
  }

  // ── State ──────────────────────────────────────────────────────────────────
  let _userPlan      = 'free';
  let _scorecardRaw  = '';
  let _ttsAudio      = null;
  let _ttsPlaying    = false;
  let _ttsPaused     = false;

  // ── UI helpers ─────────────────────────────────────────────────────────────
  function _setLoading(show) {
    document.getElementById('loading-spinner').style.display = show ? 'flex' : 'none';
  }

  const _HIRE_SIGNAL_CONFIG = {
    'Strong Yes': { cls: 'signal-strong-yes', emoji: '🟢', label: 'Strong Yes' },
    'Yes':        { cls: 'signal-yes',        emoji: '✅', label: 'Yes'         },
    'Borderline': { cls: 'signal-borderline', emoji: '🟡', label: 'Borderline'  },
    'Not Yet':    { cls: 'signal-not-yet',    emoji: '🔴', label: 'Not Yet'     },
  };

  function _showHireHero(hireSignal) {
    const cfg = _HIRE_SIGNAL_CONFIG[hireSignal];
    if (!cfg) return;
    const hero = document.getElementById('hire-hero');
    hero.classList.add(cfg.cls);
    document.getElementById('hire-emoji').textContent = cfg.emoji;
    document.getElementById('hire-value').textContent  = cfg.label;
    hero.style.display = 'block';
  }

  function _showPaywall(hireSignal) {
    _setLoading(false);
    if (hireSignal) _showHireHero(hireSignal);
    document.getElementById('paywall-state').style.display = 'block';
    applyI18n();
    lucide.createIcons();
  }

  function _showError(title, sub) {
    _setLoading(false);
    document.getElementById('error-title').textContent = title || 'Scorecard not found';
    document.getElementById('error-sub').textContent   = sub   || 'This scorecard could not be loaded.';
    document.getElementById('error-state').style.display = 'block';
  }

  function _showScorecard(text, hireSignal) {
    _scorecardRaw = text;
    _userPlan = 'hunter';
    _setLoading(false);
    if (hireSignal) _showHireHero(hireSignal);
    document.getElementById('scorecard-body').innerHTML = marked.parse(text);
    document.getElementById('scorecard-content').style.display = 'block';
    lucide.createIcons();
  }

  async function _loadPlanPill() {
    try {
      const res = await fetch('/auth/me', { headers: { 'Authorization': `Bearer ${_authToken}` } });
      if (!res.ok) return;
      const user = await res.json();
      _userPlan = user.plan || 'free';
      const pill = document.getElementById('plan-pill');
      if (_userPlan === 'hunter') {
        pill.textContent = 'Hunter';
        pill.style.cssText = 'background:rgba(99,102,241,0.15);color:var(--brand-primary);border-color:rgba(99,102,241,0.3);';
      }
    } catch {}
  }

  // ── TTS ────────────────────────────────────────────────────────────────────
  function _stripMd(md) {
    return md
      .replace(/#{1,6}\s+/g, '')
      .replace(/\*\*(.+?)\*\*/gs, '$1')
      .replace(/\*(.+?)\*/gs, '$1')
      .replace(/^[-*+]\s+/gm, '')
      .replace(/^\d+\.\s+/gm, '')
      .replace(/^>\s*/gm, '')
      .replace(/---+/g, '. ')
      .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
      .replace(/`[^`]+`/g, '')
      .replace(/\n{3,}/g, '\n\n')
      .trim();
  }

  function _setTtsBtn(state) {
    const btn     = document.getElementById('tts-btn');
    const stopBtn = document.getElementById('tts-stop-btn');
    const label   = btn.querySelector('.tts-label');
    const iconEl  = btn.querySelector('.tts-icon');
    btn.classList.remove('playing');
    if (state === 'loading') {
      btn.disabled = true;
      iconEl.setAttribute('data-lucide', 'loader');
      label.textContent = t('interview.tts.loading');
      btn.classList.add('playing');
      stopBtn.style.display = 'none';
    } else if (state === 'playing') {
      btn.disabled = false;
      iconEl.setAttribute('data-lucide', 'pause');
      label.textContent = t('interview.tts.pause');
      stopBtn.style.display = '';
    } else if (state === 'paused') {
      btn.disabled = false;
      iconEl.setAttribute('data-lucide', 'play');
      label.textContent = t('interview.tts.resume');
      stopBtn.style.display = '';
    } else {
      btn.disabled = false;
      iconEl.setAttribute('data-lucide', 'volume-2');
      label.textContent = t('interview.tts.readScorecard');
      stopBtn.style.display = 'none';
    }
    lucide.createIcons();
  }

  function stopTTS() {
    if (_ttsAudio) { _ttsAudio.pause(); _ttsAudio = null; }
    _ttsPlaying = false;
    _ttsPaused  = false;
    _setTtsBtn('idle');
  }

  function _stopTTS() { stopTTS(); }

  async function _fetchChunk(text, voice, lang) {
    const url = `/tts?text=${encodeURIComponent(text)}&voice=${encodeURIComponent(voice)}&lang=${encodeURIComponent(lang)}&mode=scorecard`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('TTS chunk error');
    const blob = await res.blob();
    return URL.createObjectURL(blob);
  }

  function _playChunk(url) {
    return new Promise((resolve, reject) => {
      _ttsAudio = new Audio(url);
      _ttsAudio.onended  = () => { URL.revokeObjectURL(url); resolve(); };
      _ttsAudio.onerror  = () => { URL.revokeObjectURL(url); reject(); };
      _ttsAudio.play();
    });
  }

  async function _playTTS() {
    const plain = _stripMd(_scorecardRaw);
    if (!plain) return;

    // Collapse all whitespace into single spaces before chunking
    const collapsed = plain.replace(/\s+/g, ' ').trim();

    // Split on sentence boundaries to create natural chunks
    const CHUNK_LIMIT = 400;
    const paras = collapsed.match(/[^.!?]+[.!?]+["']?|[^.!?]+$/g) || [collapsed];
    const chunks = [];
    let current = '';
    for (const para of paras) {
      if (current && current.length + para.length + 1 > CHUNK_LIMIT) {
        chunks.push(current);
        current = para;
      } else {
        current = current ? current + ' ' + para : para;
      }
    }
    if (current) chunks.push(current);

    if (!chunks.length) return;
    _setTtsBtn('loading');

    try {
      const cfgRes = await fetch('/tts-config');
      const cfg    = cfgRes.ok ? await cfgRes.json() : {};
      const voice  = cfg.scorecard_voice || 'Charon';
      const lang   = localStorage.getItem('preferred_lang') || 'pt';

      // Fetch all chunks in parallel, play in order
      const urlPromises = chunks.map(chunk => _fetchChunk(chunk, voice, lang));

      // Start playing as soon as first chunk is ready
      const firstUrl = await urlPromises[0];
      _ttsPlaying = true;
      _setTtsBtn('playing');

      for (let i = 0; i < urlPromises.length; i++) {
        if (!_ttsPlaying) break;
        const url = i === 0 ? firstUrl : await urlPromises[i];
        if (!_ttsPlaying) { URL.revokeObjectURL(url); break; }
        await _playChunk(url);
      }
    } catch { /* silent */ }

    _stopTTS();
  }

  async function toggleTTS() {
    if (!_ttsPlaying && !_ttsPaused) {
      if (_userPlan !== 'hunter') { _showUpgradeModal(); return; }
      await _playTTS();
      return;
    }
    if (_ttsPaused) {
      _ttsPaused = false;
      _setTtsBtn('playing');
      if (_ttsAudio) _ttsAudio.play();
      return;
    }
    // pause
    _ttsPaused = true;
    _setTtsBtn('paused');
    if (_ttsAudio) _ttsAudio.pause();
  }

  function _showUpgradeModal() {
    const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg-surface').trim() || '#1e2035';
    const textColor = getComputedStyle(document.documentElement).getPropertyValue('--text-primary').trim() || '#e2e8f0';
    Swal.fire({
      title: t('scorecard.tts.upgradeTitle'),
      text:  t('scorecard.tts.upgradeBody'),
      icon:  'info',
      background:          bg,
      color:               textColor,
      iconColor:           '#6366f1',
      showCancelButton:    true,
      cancelButtonText:    t('interview.cancel') || 'Cancel',
      confirmButtonText:   t('upgrade.heroLabel') || 'See Plans',
      confirmButtonColor:  '#6366f1',
      cancelButtonColor:   '#374151',
      reverseButtons:      true,
    }).then(r => { if (r.isConfirmed) window.location.href = '/upgrade.html'; });
  }

  async function _init() {
    const threadId = location.pathname.split('/scorecard/')[1];
    if (!threadId) {
      _showError(t('scorecard.error.invalidUrl'), t('scorecard.error.invalidUrlSub'));
      return;
    }

    document.getElementById('scorecard-sub').textContent = threadId;

    // ── Fetch only — network errors caught here ──────────────────────────────
    let data;
    try {
      const res = await fetch(`/sessions/${threadId}/scorecard`, {
        headers: { 'Authorization': `Bearer ${_authToken}` }
      });
      if (res.status === 404) {
        _showError(t('scorecard.error.notFound'), t('scorecard.error.notFoundSub'));
        return;
      }
      if (!res.ok) {
        _showError(t('scorecard.error.load'), t('scorecard.error.loadSub'));
        return;
      }
      data = await res.json();
    } catch (err) {
      console.error('[scorecard] fetch error:', err);
      _showError(t('scorecard.error.network'), t('scorecard.error.networkSub'));
      return;
    }

    // ── Display — JS errors here do not show "network error" ─────────────────
    if (!data.scorecard) {
      _showPaywall(data.hire_signal);
    } else {
      _showScorecard(data.scorecard, data.hire_signal);
    }

    // Enrich title with job/company from session list
    try {
      const sessionsRes = await fetch('/sessions', { headers: { 'Authorization': `Bearer ${_authToken}` } });
      if (sessionsRes.ok) {
        const sessions = await sessionsRes.json();
        const session  = sessions.find(s => s.threadId === threadId);
        if (session) {
          const title = [session.jobTitle, session.company].filter(Boolean).join(' — ');
          if (title) document.getElementById('scorecard-title').textContent = title;
          const d = new Date(session.startedAt);
          const locale = (i18n.currentLang() === 'pt') ? 'pt-BR' : 'en-US';
          document.getElementById('scorecard-sub').textContent =
            d.toLocaleDateString(locale, { year: 'numeric', month: 'long', day: 'numeric' });
        }
      }
    } catch {}
  }

  function closeMobileMenu() {
    document.getElementById('mobile-drawer').classList.remove('open');
  }
  document.getElementById('hamburger-btn').addEventListener('click', () => {
    document.getElementById('mobile-drawer').classList.toggle('open');
  });

  _loadPlanPill();
  document.addEventListener('i18n:ready', _init, { once: true });
</script>
</body>
</html>
