<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="login.pageTitle">Sign In — Acing Interviews</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Styles -->
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  
  <script src="/i18n.js"></script>
  <!-- TikTok Pixel -->
  <script src="/analytics.js"></script>
</head>
<body>

<div class="auth-wrapper">
  <div class="glass-card auth-card">
    <div class="auth-header">
      <a href="/" style="text-decoration:none">
        <div class="auth-header-logo">
          <i data-lucide="target"></i>
        </div>
      </a>
      <h1 data-i18n="login.title">Welcome back</h1>
      <p data-i18n="login.subtitle">Sign in to your acing interviews account</p>
    </div>

    <div class="alert alert-error" id="error-msg" style="display:none">
      <i data-lucide="alert-circle" style="width:18px;height:18px;flex-shrink:0;margin-top:1px"></i>
      <span id="error-text"></span>
    </div>

    <!-- Unverified email warning (separate from generic error) -->
    <div id="unverified-msg" style="display:none; background:rgba(234,179,8,0.12); border:1px solid rgba(234,179,8,0.35); border-radius:10px; padding:14px 16px; margin-bottom:16px; font-size:14px; color:#fbbf24; line-height:1.6;">
      <div style="font-weight:600; margin-bottom:6px;" data-i18n="login.errorEmailNotVerified">Please confirm your email before signing in.</div>
      <a id="resend-from-login" href="#" style="color:#4ade80;text-decoration:underline;font-size:13px" data-i18n="login.resendVerification">Resend confirmation email</a>
      <span id="resend-login-status" style="display:none; font-size:12px; color:var(--text-tertiary); margin-left:8px;"></span>
    </div>

    <form id="login-form" autocomplete="on">
      <div class="form-group">
        <label class="form-label" for="email" data-i18n="login.email">Email</label>
        <input class="form-input" type="email" id="email" name="email" data-i18n-attr="placeholder:login.emailPlaceholder" placeholder="you@example.com" required autocomplete="email" />
      </div>

      <div class="form-group">
        <label class="form-label" for="password" data-i18n="login.password">Password</label>
        <input class="form-input" type="password" id="password" name="password" data-i18n-attr="placeholder:login.passwordPlaceholder" placeholder="••••••••" required autocomplete="current-password" />
      </div>

      <button class="btn btn-primary" style="width:100%; margin-top:8px;" type="submit" id="submit-btn" data-i18n="login.submit">Sign in</button>
    </form>

    <div class="auth-footer" style="margin-bottom:12px">
      <a href="/forgot-password.html" data-i18n="login.forgotPassword">Forgot your password?</a>
    </div>
    <div class="auth-footer">
      <span data-i18n="login.noAccount">Don't have an account?</span> <a href="/register.html" data-i18n="login.createOne">Create one &rarr;</a>
    </div>

  </div>
</div>

<script>
  // Initialize Lucide icons
  lucide.createIcons();

  const token = localStorage.getItem('auth_token');
  if (token) {
    const returnTo = new URLSearchParams(location.search).get('next') || '/index.html';
    location.replace(returnTo);
  }

  const form           = document.getElementById('login-form');
  const errorMsg       = document.getElementById('error-msg');
  const errorText      = document.getElementById('error-text');
  const submitBtn      = document.getElementById('submit-btn');
  const unverifiedMsg  = document.getElementById('unverified-msg');
  const resendFromLogin = document.getElementById('resend-from-login');
  const resendLoginStatus = document.getElementById('resend-login-status');

  let lastEmail = '';

  function showError(msg) {
    unverifiedMsg.style.display = 'none';
    errorText.textContent = msg;
    errorMsg.style.display = 'flex';
  }

  function showUnverified() {
    errorMsg.style.display = 'none';
    unverifiedMsg.style.display = 'block';
  }

  resendFromLogin.addEventListener('click', async (e) => {
    e.preventDefault();
    if (!lastEmail) return;
    resendFromLogin.style.pointerEvents = 'none';
    resendLoginStatus.style.display = 'inline';
    resendLoginStatus.textContent = '...';
    try {
      const res = await fetch('/auth/resend-verification-public', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: lastEmail }),
      });
      if (res.status === 429) {
        const data = await res.json();
        const secs = data.detail?.wait_seconds;
        const tpl = window.t ? window.t('login.errorResendWait') : 'Please wait {seconds} seconds before requesting another email.';
        resendLoginStatus.textContent = secs ? tpl.replace('{seconds}', secs) : (window.t ? window.t('login.errorResendWaitGeneric') : 'Please wait a moment before requesting another email.');
        setTimeout(() => { resendFromLogin.style.pointerEvents = ''; resendLoginStatus.style.display = 'none'; }, 10000);
      } else {
        resendLoginStatus.textContent = window.t ? window.t('register.successResendOk') : 'Email resent!';
        setTimeout(() => { resendFromLogin.style.pointerEvents = ''; }, 30000);
      }
    } catch {
      resendLoginStatus.textContent = window.t ? window.t('login.errorNetwork') : 'Network error';
      resendFromLogin.style.pointerEvents = '';
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.style.display = 'none';
    unverifiedMsg.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span>' + (window.t ? window.t('login.signingIn') : 'Signing in...');

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    lastEmail = email;

    try {
      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (!res.ok) {
        if (res.status === 403 && data.detail === 'email_not_verified') {
          showUnverified();
        } else {
          showError(data.detail || (window.t ? window.t('login.errorCredentials') : 'Invalid credentials'));
        }
        return;
      }
      localStorage.setItem('auth_token', data.access_token);
      localStorage.setItem('auth_user', JSON.stringify(data.user));
      const returnTo = new URLSearchParams(location.search).get('next') || '/index.html';
      location.replace(returnTo);
    } catch (err) {
      showError(window.t ? window.t('login.errorNetwork') : 'Network error');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = window.t ? window.t('login.submit') : 'Sign in';
    }
  });
</script>
<script src="/contact-widget.js"></script>
</body>
</html>
