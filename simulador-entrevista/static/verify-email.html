<!DOCTYPE html>
<html lang="en">
<head>







  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Email — Acing Interviews</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/i18n.js?v=6"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="/css/main.css?v=6">
  <link rel="stylesheet" href="/css/components.css?v=6">
  <link rel="stylesheet" href="/css/layout.css?v=6">
  <script src="/analytics.js"></script>
</head>
<body>

<div class="auth-wrapper">
  <div class="glass-card auth-card text-center" id="card">
    <div class="flex justify-center mb-6 text-brand-primary">
      <div class="spinner" style="width:36px;height:36px;border-width:3px;border-top-color:var(--brand-primary);border-color:var(--bg-surface-border)"></div>
    </div>
    <div class="auth-header">
      <h1 data-i18n="verifyEmail.loading">Verifying...</h1>
      <p data-i18n="verifyEmail.loadingDesc">Please wait a moment.</p>
    </div>
  </div>
</div>

<script>
  lucide.createIcons();

  const token = new URLSearchParams(location.search).get('token');
  const card  = document.getElementById('card');

  const t = (k) => window.t ? window.t(k) : k;

  async function verify() {
    if (!token) {
      card.innerHTML = `
        <div class="flex justify-center mb-6" style="color:var(--status-error)">
          <i data-lucide="x-circle" style="width:48px;height:48px;"></i>
        </div>
        <div class="auth-header">
          <h1>${t('verifyEmail.invalidTitle')}</h1>
          <p>${t('verifyEmail.invalidDesc')}</p>
        </div>
        <a class="btn btn-secondary" style="width:100%" href="/login.html">${t('verifyEmail.goSignIn')}</a>
      `;
      lucide.createIcons();
      return;
    }
    try {
      const res  = await fetch(`/auth/verify-email?token=${encodeURIComponent(token)}`);
      const data = await res.json();
      if (res.ok) {
        try { if (window.ttq) window.ttq.track('CompleteRegistration', { contents: [{ content_id: 'user_registration', content_name: 'User Registration', content_type: 'product' }] }); } catch {}
        try {
          const u = JSON.parse(localStorage.getItem('auth_user') || 'null');
          if (u) { u.email_verified = true; localStorage.setItem('auth_user', JSON.stringify(u)); }
        } catch {}
        card.innerHTML = `
          <div class="flex justify-center mb-6" style="color:var(--status-success)">
            <i data-lucide="check-circle" style="width:48px;height:48px;"></i>
          </div>
          <div class="auth-header">
            <h1>${t('verifyEmail.successTitle')}</h1>
            <p>${t('verifyEmail.successDesc')}</p>
          </div>
          <a class="btn btn-primary" style="width:100%" href="/login.html">${t('verifyEmail.successBtn')}</a>
        `;
      } else {
        card.innerHTML = `
          <div class="flex justify-center mb-6" style="color:var(--status-warning)">
            <i data-lucide="alert-triangle" style="width:48px;height:48px;"></i>
          </div>
          <div class="auth-header">
            <h1>${t('verifyEmail.expiredTitle')}</h1>
            <p>${t('verifyEmail.expiredDesc')}</p>
          </div>
          <a class="btn btn-secondary" style="width:100%" href="/login.html">${t('verifyEmail.goSignIn')}</a>
        `;
      }
    } catch {
      card.innerHTML = `
        <div class="flex justify-center mb-6" style="color:var(--status-error)">
          <i data-lucide="x-circle" style="width:48px;height:48px;"></i>
        </div>
        <div class="auth-header">
          <h1>${t('verifyEmail.errorTitle')}</h1>
          <p>${t('verifyEmail.errorDesc')}</p>
        </div>
        <a class="btn btn-secondary" style="width:100%" href="/login.html">${t('verifyEmail.goSignIn')}</a>
      `;
    }
    lucide.createIcons();
  }

  document.addEventListener('i18n:ready', verify, { once: true });
  if (document.readyState !== 'loading') verify();
</script>
<script src="/contact-widget.js"></script>
</body>
</html>
