<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Email — Acing Interview</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Styles -->
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <!-- TikTok Pixel -->
  <script>
  !function(w,d,t){w.TiktokAnalyticsObject=t;var ttq=w[t]=w[t]||[];ttq.methods=["page","track","identify","instances","debug","on","off","once","ready","alias","group","enableCookie","disableCookie","holdConsent","revokeConsent","grantConsent"],ttq.setAndDefer=function(t,e){t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}};for(var i=0;i<ttq.methods.length;i++)ttq.setAndDefer(ttq,ttq.methods[i]);ttq.instance=function(t){for(var e=ttq._i[t]||[],n=0;n<ttq.methods.length;n++)ttq.setAndDefer(e,ttq.methods[n]);return e},ttq.load=function(e,n){var r="https://analytics.tiktok.com/i18n/pixel/events.js",o=n&&n.partner;ttq._i=ttq._i||{},ttq._i[e]=[],ttq._i[e]._u=r,ttq._t=ttq._t||{},ttq._t[e]=+new Date,ttq._o=ttq._o||{},ttq._o[e]=n||{};n=document.createElement("script");n.type="text/javascript",n.async=!0,n.src=r+"?sdkid="+e+"&lib="+t;e=document.getElementsByTagName("script")[0];e.parentNode.insertBefore(n,e)};ttq.load('D7V9SJRC77U4TTGIK5I0');ttq.page({content_id:'acinginterviews'})}(window,document,'ttq');
  </script>
</head>
<body>

<div class="auth-wrapper">
  <div class="glass-card auth-card text-center" id="card">
    <div class="flex justify-center mb-6 text-brand-primary">
      <div class="spinner" style="width:36px;height:36px;border-width:3px;border-top-color:var(--brand-primary);border-color:var(--bg-surface-border)"></div>
    </div>
    <div class="auth-header">
      <h1>Verifying...</h1>
      <p>Please wait a moment.</p>
    </div>
  </div>
</div>

<script>
  lucide.createIcons();

  const token = new URLSearchParams(location.search).get('token');
  const card  = document.getElementById('card');

  async function verify() {
    if (!token) {
      card.innerHTML = `
        <div class="flex justify-center mb-6" style="color:var(--status-error)">
          <i data-lucide="x-circle" style="width:48px;height:48px;"></i>
        </div>
        <div class="auth-header">
          <h1>Invalid link</h1>
          <p>This verification link is missing a token.</p>
        </div>
        <a class="btn btn-secondary" style="width:100%" href="/login.html">Go to sign in</a>
      `;
      lucide.createIcons();
      return;
    }
    try {
      const res  = await fetch(`/auth/verify-email?token=${encodeURIComponent(token)}`);
      const data = await res.json();
      if (res.ok) {
        try { if (window.ttq) window.ttq.track('CompleteRegistration', { content_id: 'user_registration' }); } catch {}
        try {
          const u = JSON.parse(localStorage.getItem('auth_user') || 'null');
          if (u) { u.email_verified = true; localStorage.setItem('auth_user', JSON.stringify(u)); }
        } catch {}
        card.innerHTML = `
          <div class="flex justify-center mb-6" style="color:var(--status-success)">
            <i data-lucide="check-circle" style="width:48px;height:48px;"></i>
          </div>
          <div class="auth-header">
            <h1>Email verified!</h1>
            <p>Your account is fully activated. You can now continue your interviews.</p>
          </div>
          <a class="btn btn-primary" style="width:100%" href="/interview.html">Continue &rarr;</a>
        `;
      } else {
        card.innerHTML = `
          <div class="flex justify-center mb-6" style="color:var(--status-warning)">
            <i data-lucide="alert-triangle" style="width:48px;height:48px;"></i>
          </div>
          <div class="auth-header">
            <h1>Link expired</h1>
            <p>${data.detail || 'This verification link has expired or already been used.'}</p>
          </div>
          <a class="btn btn-secondary" style="width:100%" href="/login.html">Go to sign in</a>
        `;
      }
    } catch {
      card.innerHTML = `
        <div class="flex justify-center mb-6" style="color:var(--status-error)">
          <i data-lucide="x-circle" style="width:48px;height:48px;"></i>
        </div>
        <div class="auth-header">
          <h1>Network error</h1>
          <p>Could not verify your email. Please try again.</p>
        </div>
        <a class="btn btn-secondary" style="width:100%" href="/login.html">Go to sign in</a>
      `;
    }
    lucide.createIcons();
  }

  verify();
</script>
<script src="/contact-widget.js"></script>
</body>
</html>
