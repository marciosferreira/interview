<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Interview Coach</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117; color: #e2e8f0;
      min-height: 100dvh; display: flex; flex-direction: column;
    }

    header {
      padding: 14px 24px; background: #1a1d27;
      border-bottom: 1px solid #2d3148;
      display: flex; align-items: center; gap: 12px; flex-shrink: 0;
      position: sticky; top: 0; z-index: 100;
    }
    .logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 10px; display: flex; align-items: center;
      justify-content: center; font-size: 18px; flex-shrink: 0;
    }
    header h1 { font-size: 16px; font-weight: 600; color: #f1f5f9; }
    header p  { font-size: 12px; color: #64748b; margin-top: 1px; }
    .home-link {
      display: flex; align-items: center; gap: 12px;
      text-decoration: none; color: inherit;
      border-radius: 10px; padding: 2px 6px; margin: -2px -6px;
      transition: background 0.2s;
    }
    .home-link:hover { background: rgba(99,102,241,0.08); }
    .hdr-spacer { margin-left: auto; }
    .hdr-btn {
      font-size: 11px; font-weight: 500; padding: 5px 12px;
      border-radius: 20px; background: transparent; border: 1px solid #2d3148;
      color: #64748b; text-decoration: none; transition: all 0.2s; flex-shrink: 0;
    }
    .hdr-btn:hover { border-color: #6366f1; color: #a78bfa; }

    main { flex: 1; padding: 32px 24px; max-width: 1200px; margin: 0 auto; width: 100%; }

    /* ── Summary cards ── */
    .summary {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px; margin-bottom: 32px;
    }
    .stat-card {
      background: #1a1d27; border: 1px solid #2d3148;
      border-radius: 14px; padding: 18px 20px;
    }
    .stat-card .label { font-size: 11px; color: #64748b; font-weight: 500; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.06em; }
    .stat-card .value { font-size: 28px; font-weight: 800; color: #f1f5f9; }
    .stat-card .value.hunter { color: #a78bfa; }
    .stat-card .value.green  { color: #4ade80; }

    /* ── Section title ── */
    .section-title {
      font-size: 13px; font-weight: 700; color: #94a3b8;
      text-transform: uppercase; letter-spacing: 0.06em;
      margin-bottom: 14px;
    }

    /* ── Table ── */
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%; border-collapse: collapse;
      font-size: 13px;
    }
    thead th {
      text-align: left; padding: 10px 14px;
      font-size: 11px; font-weight: 700; color: #475569;
      text-transform: uppercase; letter-spacing: 0.06em;
      border-bottom: 1px solid #2d3148;
      white-space: nowrap; cursor: pointer; user-select: none;
    }
    thead th:hover { color: #a78bfa; }
    tbody tr { border-bottom: 1px solid #1e2235; transition: background 0.12s; }
    tbody tr:hover { background: #1a1d27; }
    tbody td { padding: 11px 14px; color: #94a3b8; vertical-align: middle; white-space: nowrap; }
    tbody td.name { color: #e2e8f0; font-weight: 500; }
    tbody td.email { color: #64748b; font-size: 12px; }

    .badge {
      display: inline-block; font-size: 10px; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase;
      padding: 2px 8px; border-radius: 20px;
    }
    .badge.hunter   { background: #312e81; color: #a5b4fc; }
    .badge.explorer { background: #1e293b; color: #64748b; }
    .badge.verified   { background: #052e16; color: #4ade80; }
    .badge.unverified { background: #1a0f0f; color: #f87171; }

    .plan-btn {
      font-size: 11px; font-weight: 600; padding: 4px 10px;
      border-radius: 8px; cursor: pointer; border: none; transition: all 0.15s;
    }
    .plan-btn.promote  { background: #312e81; color: #a5b4fc; }
    .plan-btn.promote:hover  { background: #4338ca; color: #fff; }
    .plan-btn.demote   { background: #1e293b; color: #64748b; }
    .plan-btn.demote:hover   { background: #2d3148; color: #e2e8f0; }
    .plan-btn.delete   { background: transparent; color: #f87171; border: 1px solid #450a0a; margin-left: 6px; }
    .plan-btn.delete:hover   { background: #1a0f0f; border-color: #f87171; }
    .plan-btn.verify   { background: #052e16; color: #4ade80; border: 1px solid #14532d; margin-left: 6px; }
    .plan-btn.verify:hover   { background: #14532d; color: #fff; }
    .plan-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Search ── */
    .toolbar {
      display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap;
    }
    #search {
      flex: 1; min-width: 200px; max-width: 320px;
      background: #1a1d27; border: 1px solid #2d3148;
      border-radius: 10px; padding: 8px 14px;
      color: #e2e8f0; font-size: 13px; outline: none;
    }
    #search::placeholder { color: #475569; }
    #search:focus { border-color: #6366f1; }
    .filter-btn {
      font-size: 12px; padding: 6px 14px; border-radius: 10px;
      background: transparent; border: 1px solid #2d3148;
      color: #64748b; cursor: pointer; transition: all 0.15s;
    }
    .filter-btn.active { border-color: #6366f1; color: #a78bfa; background: #1e1b4b; }
    #row-count { font-size: 12px; color: #475569; margin-left: auto; }

    #loading { text-align: center; padding: 60px; color: #475569; font-size: 14px; }
    #error   { text-align: center; padding: 60px; color: #f87171; font-size: 14px; }
  </style>
</head>
<body>

<header>
  <a class="home-link" href="/">
    <div class="logo">🎯</div>
    <div><h1>Interview Coach</h1><p>Admin panel</p></div>
  </a>
  <span class="hdr-spacer"></span>
  <a class="hdr-btn" href="/admin-contact.html" id="contact-link">✉ Messages</a>
  <a class="hdr-btn" href="/history.html">📋 History</a>
  <a class="hdr-btn" href="/profile.html">⚙️ Settings</a>
</header>

<main>
  <div id="loading">Loading users…</div>
  <div id="error" style="display:none"></div>

  <div id="content" style="display:none">
    <!-- Summary cards -->
    <div class="summary" id="summary"></div>

    <div class="section-title">Users</div>

    <div class="toolbar">
      <input id="search" type="text" placeholder="Search name or email…" oninput="applyFilters()" />
      <button class="filter-btn active" data-filter="all"     onclick="setFilter('all',this)">All</button>
      <button class="filter-btn"        data-filter="hunter"  onclick="setFilter('hunter',this)">🎯 Hunter</button>
      <button class="filter-btn"        data-filter="explorer" onclick="setFilter('explorer',this)">🗺️ Explorer</button>
      <button class="filter-btn"        data-filter="verified" onclick="setFilter('verified',this)">Verified</button>
      <span id="row-count"></span>
    </div>

    <div class="table-wrap">
      <table id="users-table">
        <thead>
          <tr>
            <th onclick="sortBy('name')">Name ↕</th>
            <th onclick="sortBy('email')">Email ↕</th>
            <th onclick="sortBy('plan')">Plan ↕</th>
            <th>Verified</th>
            <th onclick="sortBy('created_at')">Joined ↕</th>
            <th onclick="sortBy('total_sessions')">Sessions ↕</th>
            <th onclick="sortBy('completed')">Done ↕</th>
            <th onclick="sortBy('sessions_week')">This week ↕</th>
            <th onclick="sortBy('last_active')">Last active ↕</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="users-tbody"></tbody>
      </table>
    </div>
  </div>
</main>

<script>
  const _token = localStorage.getItem('auth_token');
  if (!_token) location.replace('/login.html?next=/admin.html');

  // Badge: unread contact messages
  (async () => {
    try {
      const res = await fetch('/admin/contact', { headers: { 'Authorization': `Bearer ${_token}` } });
      if (res.ok) {
        const data = await res.json();
        const pending = (data.messages || []).filter(m => !m.replied_at).length;
        if (pending > 0) {
          const link = document.getElementById('contact-link');
          link.innerHTML = `✉ Messages <span style="background:#6366f1;color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:20px;margin-left:4px">${pending}</span>`;
        }
      }
    } catch (_) {}
  })();

  let _users = [];
  let _filter = 'all';
  let _sortKey = 'created_at';
  let _sortDir = -1;

  function _fmt(ms) {
    if (!ms) return '—';
    const d = new Date(ms);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function _rel(ms) {
    if (!ms) return '—';
    const diff = Date.now() - ms;
    if (diff < 60000)    return 'just now';
    if (diff < 3600000)  return Math.floor(diff / 60000) + 'm ago';
    if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
    return Math.floor(diff / 86400000) + 'd ago';
  }

  async function load() {
    try {
      const res = await fetch('/admin/users', { headers: { 'Authorization': `Bearer ${_token}` } });
      if (res.status === 403) { showError('Access denied — admin only.'); return; }
      if (!res.ok) { showError('Failed to load users.'); return; }
      const data = await res.json();
      _users = data.users;
      renderSummary();
      applyFilters();
      document.getElementById('loading').style.display = 'none';
      document.getElementById('content').style.display = '';
    } catch (e) {
      showError('Network error: ' + e.message);
    }
  }

  function showError(msg) {
    document.getElementById('loading').style.display = 'none';
    const el = document.getElementById('error');
    el.textContent = msg;
    el.style.display = '';
  }

  function renderSummary() {
    const total    = _users.length;
    const verified = _users.filter(u => u.email_verified).length;
    const hunters  = _users.filter(u => u.plan === 'hunter').length;
    const sessions = _users.reduce((s, u) => s + u.total_sessions, 0);
    const done     = _users.reduce((s, u) => s + u.completed, 0);
    document.getElementById('summary').innerHTML = `
      <div class="stat-card"><div class="label">Total users</div><div class="value">${total}</div></div>
      <div class="stat-card"><div class="label">Email verified</div><div class="value green">${verified}</div></div>
      <div class="stat-card"><div class="label">Hunter plan</div><div class="value hunter">${hunters}</div></div>
      <div class="stat-card"><div class="label">Total sessions</div><div class="value">${sessions}</div></div>
      <div class="stat-card"><div class="label">Completed interviews</div><div class="value">${done}</div></div>
    `;
  }

  function setFilter(f, btn) {
    _filter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyFilters();
  }

  function sortBy(key) {
    if (_sortKey === key) _sortDir *= -1;
    else { _sortKey = key; _sortDir = -1; }
    applyFilters();
  }

  function applyFilters() {
    const q = document.getElementById('search').value.trim().toLowerCase();
    let rows = _users.filter(u => {
      if (_filter === 'hunter'   && u.plan !== 'hunter') return false;
      if (_filter === 'explorer' && u.plan !== 'free')   return false;
      if (_filter === 'verified' && !u.email_verified)   return false;
      if (q && !u.name.toLowerCase().includes(q) && !u.email.toLowerCase().includes(q)) return false;
      return true;
    });
    rows.sort((a, b) => {
      const av = a[_sortKey] ?? 0, bv = b[_sortKey] ?? 0;
      return av < bv ? _sortDir : av > bv ? -_sortDir : 0;
    });
    document.getElementById('row-count').textContent = `${rows.length} user${rows.length !== 1 ? 's' : ''}`;
    renderRows(rows);
  }

  function renderRows(rows) {
    const tbody = document.getElementById('users-tbody');
    tbody.innerHTML = '';
    for (const u of rows) {
      const isHunter = u.plan === 'hunter';
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="name">${esc(u.name)}</td>
        <td class="email">${esc(u.email)}</td>
        <td><span class="badge ${isHunter ? 'hunter' : 'explorer'}">${isHunter ? '🎯 Hunter' : '🗺️ Explorer'}</span></td>
        <td><span class="badge ${u.email_verified ? 'verified' : 'unverified'}">${u.email_verified ? '✓ Yes' : '✕ No'}</span></td>
        <td>${_fmt(u.created_at)}</td>
        <td>${u.total_sessions}</td>
        <td>${u.completed}</td>
        <td>${u.sessions_week}</td>
        <td title="${u.last_active ? new Date(u.last_active).toLocaleString() : ''}">${_rel(u.last_active)}</td>
        <td>
          ${isHunter
            ? `<button class="plan-btn demote"  onclick="setPlan('${u.id}','free',this)">Demote</button>`
            : `<button class="plan-btn promote" onclick="setPlan('${u.id}','hunter',this)">Promote</button>`
          }
          ${!u.email_verified
            ? `<button class="plan-btn verify" onclick="verifyEmail('${u.id}',this)">Verify</button>`
            : ''
          }
          ${u.email !== 'marciosferreira@yahoo.com.br'
            ? `<button class="plan-btn delete" onclick="deleteUser('${u.id}','${esc(u.name)}',this)">Delete</button>`
            : ''
          }
        </td>
      `;
      tbody.appendChild(tr);
    }
  }

  async function setPlan(userId, plan, btn) {
    btn.disabled = true;
    btn.textContent = '…';
    try {
      const res = await fetch(`/admin/users/${userId}/plan`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${_token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ plan }),
      });
      if (!res.ok) { alert('Failed to update plan.'); btn.disabled = false; return; }
      const u = _users.find(u => u.id === userId);
      if (u) u.plan = plan;
      renderSummary();
      applyFilters();
    } catch {
      alert('Network error.'); btn.disabled = false;
    }
  }

  async function verifyEmail(userId, btn) {
    btn.disabled = true;
    btn.textContent = '…';
    try {
      const res = await fetch(`/admin/users/${userId}/verify`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${_token}` },
      });
      if (!res.ok) { alert('Failed to verify email.'); btn.disabled = false; btn.textContent = 'Verify'; return; }
      const u = _users.find(u => u.id === userId);
      if (u) u.email_verified = true;
      renderSummary();
      applyFilters();
    } catch {
      alert('Network error.'); btn.disabled = false; btn.textContent = 'Verify';
    }
  }

  async function deleteUser(userId, name, btn) {
    if (!confirm(`Delete "${name}" and all their interview data? This cannot be undone.`)) return;
    btn.disabled = true;
    btn.textContent = '…';
    try {
      const res = await fetch(`/admin/users/${userId}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${_token}` },
      });
      if (!res.ok) { alert('Failed to delete user.'); btn.disabled = false; btn.textContent = 'Delete'; return; }
      _users = _users.filter(u => u.id !== userId);
      renderSummary();
      applyFilters();
    } catch {
      alert('Network error.'); btn.disabled = false; btn.textContent = 'Delete';
    }
  }

  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  load();
</script>
</body>
</html>
