<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="reset.pageTitle">Reset Password — Acing Interview</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Styles -->
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  
  <script src="/i18n.js"></script>
  <!-- TikTok Pixel -->
  <script>
  !function(w,d,t){w.TiktokAnalyticsObject=t;var ttq=w[t]=w[t]||[];ttq.methods=["page","track","identify","instances","debug","on","off","once","ready","alias","group","enableCookie","disableCookie","holdConsent","revokeConsent","grantConsent"],ttq.setAndDefer=function(t,e){t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}};for(var i=0;i<ttq.methods.length;i++)ttq.setAndDefer(ttq,ttq.methods[i]);ttq.instance=function(t){for(var e=ttq._i[t]||[],n=0;n<ttq.methods.length;n++)ttq.setAndDefer(e,ttq.methods[n]);return e},ttq.load=function(e,n){var r="https://analytics.tiktok.com/i18n/pixel/events.js",o=n&&n.partner;ttq._i=ttq._i||{},ttq._i[e]=[],ttq._i[e]._u=r,ttq._t=ttq._t||{},ttq._t[e]=+new Date,ttq._o=ttq._o||{},ttq._o[e]=n||{};n=document.createElement("script");n.type="text/javascript",n.async=!0,n.src=r+"?sdkid="+e+"&lib="+t;e=document.getElementsByTagName("script")[0];e.parentNode.insertBefore(n,e)};ttq.load('D7V9SJRC77U4TTGIK5I0');ttq.page({content_id:'acinginterviews'})}(window,document,'ttq');
  </script>
</head>
<body>

<div class="auth-wrapper">
  <div class="glass-card auth-card">
    <div class="auth-header">
      <a href="/" style="text-decoration:none">
        <div class="auth-header-logo">
          <i data-lucide="target"></i>
        </div>
      </a>
      <h1 data-i18n="reset.title">Set new password</h1>
      <p data-i18n="reset.subtitle">Enter and confirm your new password</p>
    </div>

    <div class="alert" id="msg-container" style="display:none">
      <i id="msg-icon" data-lucide="info" style="width:18px;height:18px;flex-shrink:0;margin-top:1px"></i>
      <span id="msg-text"></span>
    </div>

    <form id="form">
      <div class="form-group">
        <label class="form-label" for="password" data-i18n="reset.newPassword">New password</label>
        <input class="form-input" type="password" id="password" data-i18n-attr="placeholder:reset.passwordPlaceholder" placeholder="At least 8 characters" required autocomplete="new-password" />
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm" data-i18n="reset.confirmPassword">Confirm password</label>
        <input class="form-input" type="password" id="confirm" data-i18n-attr="placeholder:reset.confirmPlaceholder" placeholder="Repeat password" required autocomplete="new-password" />
      </div>

      <button class="btn btn-primary" style="width:100%; margin-top:8px;" type="submit" id="submit-btn" data-i18n="reset.submit">Set new password</button>
    </form>

    <div class="auth-footer">
      <a href="/login.html" data-i18n="reset.backToSignIn">&larr; Back to sign in</a>
    </div>

    <div class="flex justify-center mt-6">
      <div class="lang-switcher">
        <button class="lang-btn" data-lang="en" onclick="i18n.switchLang('en')">EN</button>
        <button class="lang-btn" data-lang="pt" onclick="i18n.switchLang('pt')">PT</button>
      </div>
    </div>
  </div>
</div>

<script>
  lucide.createIcons();

  const token = new URLSearchParams(location.search).get('token');
  const form      = document.getElementById('form');
  const msgContainer = document.getElementById('msg-container');
  const msgIcon   = document.getElementById('msg-icon');
  const msgText   = document.getElementById('msg-text');
  const submitBtn = document.getElementById('submit-btn');

  function showMsg(text, type) {
    msgText.textContent = text;
    if(type === 'success') {
      msgContainer.className = 'alert alert-success';
      msgIcon.setAttribute('data-lucide', 'check-circle');
    } else {
      msgContainer.className = 'alert alert-error';
      msgIcon.setAttribute('data-lucide', 'alert-circle');
    }
    lucide.createIcons();
    msgContainer.style.display = 'flex';
  }

  function initPage() {
    if (!token) {
      form.style.display = 'none';
      showMsg(window.t ? window.t('reset.errorInvalidLink') : 'Invalid link', 'error');
    }
  }
  document.addEventListener('i18n:ready', initPage);
  initPage();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msgContainer.style.display = 'none';

    const pw  = document.getElementById('password').value;
    const pw2 = document.getElementById('confirm').value;
    if (pw !== pw2) { showMsg(window.t ? window.t('reset.errorMismatch') : 'Passwords do not match', 'error'); return; }
    if (pw.length < 8) { showMsg(window.t ? window.t('reset.errorTooShort') : 'Password too short', 'error'); return; }

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span>' + (window.t ? window.t('reset.saving') : 'Saving...');

    try {
      const res  = await fetch('/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, new_password: pw }),
      });
      const data = await res.json();
      if (!res.ok) { showMsg(data.detail || (window.t ? window.t('reset.errorExpired') : 'Expired link'), 'error'); return; }
      showMsg(window.t ? window.t('reset.successMsg') : 'Password reset successfully', 'success');
      form.style.display = 'none';
      setTimeout(() => location.replace('/login.html'), 2000);
    } catch {
      showMsg(window.t ? window.t('reset.errorNetwork') : 'Network error', 'error');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = window.t ? window.t('reset.submit') : 'Set new password';
    }
  });
</script>
<script src="/contact-widget.js"></script>
</body>
</html>
