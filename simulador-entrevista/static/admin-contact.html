<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Messages — Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117; color: #e2e8f0; min-height: 100dvh;
      display: flex; flex-direction: column;
    }
    header {
      padding: 14px 24px; background: #1a1d27; border-bottom: 1px solid #2d3148;
      display: flex; align-items: center; gap: 12px; flex-shrink: 0;
      position: sticky; top: 0; z-index: 100;
    }
    .logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 10px; display: flex; align-items: center;
      justify-content: center; font-size: 18px; flex-shrink: 0;
    }
    header h1 { font-size: 16px; font-weight: 600; color: #f1f5f9; }
    header p  { font-size: 12px; color: #64748b; margin-top: 1px; }
    .home-link {
      display: flex; align-items: center; gap: 12px;
      text-decoration: none; color: inherit; border-radius: 10px;
      padding: 2px 6px; margin: -2px -6px; transition: background 0.2s;
    }
    .home-link:hover { background: rgba(99,102,241,0.08); }
    .hdr-links { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .hdr-btn {
      font-size: 13px; font-weight: 500; padding: 6px 14px;
      border-radius: 8px; border: 1px solid #2d3148;
      background: transparent; color: #94a3b8; cursor: pointer;
      text-decoration: none; transition: all 0.15s;
    }
    .hdr-btn:hover { background: #2d3148; color: #e2e8f0; }
    .hdr-btn.active { background: #312e81; border-color: #4338ca; color: #a5b4fc; }

    main { flex: 1; padding: 32px 24px; max-width: 900px; margin: 0 auto; width: 100%; }

    .page-title { font-size: 22px; font-weight: 700; color: #f1f5f9; margin-bottom: 4px; }
    .page-sub   { font-size: 13px; color: #64748b; margin-bottom: 24px; }

    .badge-new {
      display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; padding: 2px 8px; border-radius: 20px;
      background: #312e81; color: #a5b4fc; margin-left: 8px; vertical-align: middle;
    }

    .msg-list { display: flex; flex-direction: column; gap: 12px; }

    .msg-card {
      background: #1a1d27; border: 1px solid #2d3148; border-radius: 12px;
      overflow: hidden; transition: border-color 0.2s;
    }
    .msg-card.unread { border-color: #4338ca; }
    .msg-card:hover { border-color: #6366f1; }

    .msg-header {
      padding: 14px 18px; cursor: pointer; display: flex; align-items: center; gap: 12px;
    }
    .msg-avatar {
      width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
      background: linear-gradient(135deg, #312e81, #4338ca);
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 700; color: #a5b4fc; text-transform: uppercase;
    }
    .msg-meta { flex: 1; min-width: 0; }
    .msg-from { font-size: 14px; font-weight: 600; color: #f1f5f9; }
    .msg-email { font-size: 12px; color: #64748b; }
    .msg-subject { font-size: 13px; font-weight: 500; color: #c7d2fe; margin-top: 2px; }
    .msg-date { font-size: 11px; color: #475569; flex-shrink: 0; }
    .msg-status {
      font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
      padding: 2px 8px; border-radius: 20px; flex-shrink: 0;
    }
    .msg-status.replied  { background: #052e16; color: #86efac; border: 1px solid #166534; }
    .msg-status.pending  { background: #312e81; color: #a5b4fc; border: 1px solid #4338ca; }
    .msg-chevron { color: #475569; font-size: 18px; flex-shrink: 0; transition: transform 0.2s; }
    .msg-card.open .msg-chevron { transform: rotate(180deg); }

    .msg-body {
      display: none; padding: 0 18px 18px; border-top: 1px solid #2d3148;
      margin-top: 0;
    }
    .msg-card.open .msg-body { display: block; }

    .msg-text {
      font-size: 14px; color: #94a3b8; line-height: 1.6;
      white-space: pre-wrap; padding: 14px 0;
    }

    .reply-section { margin-top: 12px; }
    .reply-label { font-size: 12px; font-weight: 500; color: #64748b; margin-bottom: 8px; }
    .reply-sent {
      font-size: 13px; color: #86efac; background: #052e16;
      border: 1px solid #166534; border-radius: 8px; padding: 12px 14px;
      white-space: pre-wrap; line-height: 1.5;
    }
    .reply-form textarea {
      width: 100%; padding: 10px 12px; min-height: 90px;
      background: #0f1117; border: 1px solid #2d3148;
      border-radius: 8px; color: #f1f5f9; font-size: 13px;
      outline: none; resize: vertical; font-family: inherit;
      transition: border-color 0.2s; margin-bottom: 10px;
    }
    .reply-form textarea:focus { border-color: #6366f1; }
    .reply-form textarea::placeholder { color: #475569; }
    .reply-send {
      padding: 8px 20px;
      background: linear-gradient(135deg, #6366f1, #7c3aed);
      border: none; border-radius: 8px; color: #fff;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: opacity 0.2s;
    }
    .reply-send:hover { opacity: 0.9; }
    .reply-send:disabled { opacity: 0.5; cursor: not-allowed; }
    .reply-msg {
      font-size: 12px; margin-top: 8px; padding: 6px 10px;
      border-radius: 6px; display: none;
    }
    .reply-msg.ok    { background: #052e16; color: #86efac; }
    .reply-msg.error { background: #450a0a; color: #fca5a5; }
    .reply-history {
      margin-bottom: 10px;
    }
    .reply-history + .reply-history {
      border-top: 1px solid #2d3148; padding-top: 10px;
    }
    .reply-history-label { font-size: 11px; color: #475569; margin-bottom: 6px; }
    .delete-btn {
      padding: 6px 14px; background: transparent; border: 1px solid #7f1d1d;
      border-radius: 8px; color: #fca5a5; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all 0.15s; margin-left: auto;
    }
    .delete-btn:hover { background: #450a0a; border-color: #b91c1c; }

    .empty {
      text-align: center; padding: 60px 24px; color: #475569;
    }
    .empty h3 { font-size: 18px; font-weight: 600; margin-bottom: 6px; color: #64748b; }

    .stats {
      display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap;
    }
    .stat {
      background: #1a1d27; border: 1px solid #2d3148; border-radius: 10px;
      padding: 14px 20px; min-width: 120px;
    }
    .stat-val { font-size: 26px; font-weight: 700; color: #f1f5f9; }
    .stat-lbl { font-size: 12px; color: #64748b; margin-top: 2px; }
  </style>
</head>
<body>

<header>
  <a class="home-link" href="/index.html">
    <div class="logo">🎯</div>
    <div>
      <h1>Acing Interview</h1>
      <p>Admin</p>
    </div>
  </a>
  <div class="hdr-links">
    <a class="hdr-btn" href="/admin.html">Users</a>
    <a class="hdr-btn active" href="/admin-contact.html">Messages</a>
    <a class="hdr-btn" href="/index.html">← Back to app</a>
  </div>
</header>

<main>
  <div class="page-title">Contact Messages <span class="badge-new" id="unread-badge" style="display:none"></span></div>
  <p class="page-sub">Incoming messages from the contact form.</p>

  <div class="stats">
    <div class="stat"><div class="stat-val" id="stat-total">—</div><div class="stat-lbl">Total</div></div>
    <div class="stat"><div class="stat-val" id="stat-pending">—</div><div class="stat-lbl">Pending reply</div></div>
    <div class="stat"><div class="stat-val" id="stat-replied">—</div><div class="stat-lbl">Replied</div></div>
  </div>

  <div class="msg-list" id="msg-list">
    <p style="color:#475569">Loading…</p>
  </div>
</main>

<script>
  const _token = localStorage.getItem('auth_token');
  if (!_token) location.replace('/login.html?next=/admin-contact.html');
  const _headers = { 'Authorization': `Bearer ${_token}`, 'Content-Type': 'application/json' };

  function _fmtDate(ms) {
    if (!ms) return '';
    const d = new Date(ms);
    return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function _initials(name) {
    return (name || '?').split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
  }

  function _parseReplies(replyText) {
    if (!replyText) return [];
    // Split on the separator inserted by save_contact_reply
    const parts = replyText.split(/\n\n--- Reply on /);
    return parts.map((part, i) => {
      if (i === 0) return { date: null, text: part.trim() };
      const nl = part.indexOf('\n');
      const date = nl > -1 ? part.substring(0, nl).replace(/ ---$/, '').trim() : part.trim();
      const text = nl > -1 ? part.substring(nl + 1).trim() : '';
      return { date, text };
    }).filter(r => r.text);
  }

  function _buildHistoryHtml(replyText, repliedAt) {
    const replies = _parseReplies(replyText);
    if (!replies.length) return '';
    return replies.map((r, i) => {
      const label = r.date || (i === 0 && repliedAt ? _fmtDate(repliedAt) : '—');
      return `<div class="reply-history">
         <div class="reply-history-label">Reply · ${label}</div>
         <div class="reply-sent">${_esc(r.text)}</div>
       </div>`;
    }).join('');
  }

  function _renderMessages(messages) {
    const list  = document.getElementById('msg-list');
    const total   = messages.length;
    const pending = messages.filter(m => !m.replied_at).length;
    const replied = total - pending;

    document.getElementById('stat-total').textContent   = total;
    document.getElementById('stat-pending').textContent = pending;
    document.getElementById('stat-replied').textContent = replied;

    if (pending > 0) {
      const badge = document.getElementById('unread-badge');
      badge.textContent = pending + ' new';
      badge.style.display = 'inline-block';
    }

    if (!total) {
      list.innerHTML = '<div class="empty"><h3>No messages yet</h3><p>Messages submitted via the contact form will appear here.</p></div>';
      return;
    }

    list.innerHTML = '';
    messages.forEach(msg => {
      const card = document.createElement('div');
      card.className = 'msg-card' + (msg.replied_at ? '' : ' unread');
      card.dataset.id = msg.id;

      const historyHtml = _buildHistoryHtml(msg.reply_text, msg.replied_at);

      card.innerHTML = `
        <div class="msg-header">
          <div class="msg-avatar">${_initials(msg.name)}</div>
          <div class="msg-meta">
            <div class="msg-from">${_esc(msg.name)}</div>
            <div class="msg-email">${_esc(msg.email)}</div>
            <div class="msg-subject">${_esc(msg.subject)}</div>
          </div>
          <div class="msg-date">${_fmtDate(msg.created_at)}</div>
          <span class="msg-status ${msg.replied_at ? 'replied' : 'pending'}">${msg.replied_at ? 'Replied' : 'Pending'}</span>
          <span class="msg-chevron">▾</span>
        </div>
        <div class="msg-body">
          <div class="msg-text">${_esc(msg.body)}</div>
          <div class="reply-section">
            <div class="reply-label">Reply to ${_esc(msg.name)}</div>
            ${historyHtml}
            <div class="reply-form">
              <textarea placeholder="Type your reply…" id="reply-${msg.id}"></textarea>
              <div style="display:flex;align-items:center;gap:10px">
                <button class="reply-send" onclick="sendReply('${msg.id}')">Send reply</button>
                <button class="delete-btn" onclick="deleteMsg('${msg.id}')">🗑 Delete</button>
              </div>
              <div class="reply-msg" id="rmsg-${msg.id}"></div>
            </div>
          </div>
        </div>
      `;

      card.querySelector('.msg-header').addEventListener('click', () => {
        card.classList.toggle('open');
      });

      list.appendChild(card);
    });
  }

  function _esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function sendReply(msgId) {
    const ta   = document.getElementById(`reply-${msgId}`);
    const btn  = ta.parentElement.querySelector('.reply-send');
    const rmsg = document.getElementById(`rmsg-${msgId}`);
    const text = ta.value.trim();
    if (!text) return;

    btn.disabled = true;
    btn.textContent = 'Sending…';
    rmsg.style.display = 'none';

    try {
      const res = await fetch(`/admin/contact/${msgId}/reply`, {
        method: 'POST', headers: _headers,
        body: JSON.stringify({ reply_text: text }),
      });
      if (res.ok) {
        rmsg.textContent = '✓ Reply sent';
        rmsg.className = 'reply-msg ok';
        rmsg.style.display = 'block';
        // Refresh after 1s to show replied state
        setTimeout(loadMessages, 1200);
      } else {
        const d = await res.json().catch(() => ({}));
        rmsg.textContent = d.detail || 'Failed to send reply.';
        rmsg.className = 'reply-msg error';
        rmsg.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Send reply';
      }
    } catch (_) {
      rmsg.textContent = 'Network error — please try again.';
      rmsg.className = 'reply-msg error';
      rmsg.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Send reply';
    }
  }

  async function deleteMsg(msgId) {
    if (!confirm('Delete this message? This cannot be undone.')) return;
    try {
      const res = await fetch(`/admin/contact/${msgId}`, { method: 'DELETE', headers: _headers });
      if (res.ok) {
        const card = document.querySelector(`.msg-card[data-id="${msgId}"]`);
        if (card) card.remove();
        loadMessages();
      } else {
        alert('Failed to delete message.');
      }
    } catch (_) {
      alert('Network error — please try again.');
    }
  }

  async function loadMessages() {
    try {
      const res = await fetch('/admin/contact', { headers: _headers });
      if (res.status === 403) {
        document.getElementById('msg-list').innerHTML =
          '<p style="color:#fca5a5;text-align:center;padding:40px">Access restricted to admin only.</p>';
        return;
      }
      if (!res.ok) throw new Error('Failed to load');
      const data = await res.json();
      _renderMessages(data.messages || []);
    } catch (err) {
      document.getElementById('msg-list').innerHTML =
        `<p style="color:#fca5a5;text-align:center;padding:40px">Error: ${err.message}</p>`;
    }
  }

  loadMessages();
</script>
</body>
</html>
