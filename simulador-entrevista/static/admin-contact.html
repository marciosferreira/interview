<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Messages — Admin</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Styles -->
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  
  <style>
    main { flex: 1; padding: 40px 24px; max-width: 900px; margin: 0 auto; width: 100%; }

    .page-title { font-size: 24px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
    .page-sub   { font-size: 15px; color: var(--text-secondary); margin-bottom: 32px; }

    .msg-list { display: flex; flex-direction: column; gap: 16px; }

    .msg-card {
      background: var(--bg-surface); border: 1px solid var(--bg-surface-border); border-radius: var(--radius-lg);
      overflow: hidden; transition: all 0.2s;
    }
    .msg-card.unread { border-color: var(--brand-primary); box-shadow: 0 4px 20px -5px rgba(99, 102, 241, 0.15); }
    .msg-card:hover { border-color: var(--brand-primary); }

    .msg-header {
      padding: 16px 20px; cursor: pointer; display: flex; align-items: center; gap: 16px;
    }
    .msg-avatar {
      width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
      background: rgba(99, 102, 241, 0.1); border: 1px solid rgba(99, 102, 241, 0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700; color: var(--brand-primary); text-transform: uppercase;
    }
    .msg-meta { flex: 1; min-width: 0; }
    .msg-from { font-size: 15px; font-weight: 600; color: var(--text-primary); margin-bottom: 2px; }
    .msg-email { font-size: 13px; color: var(--text-tertiary); }
    .msg-subject { font-size: 14px; font-weight: 500; color: var(--brand-secondary); margin-top: 4px; }
    .msg-date { font-size: 12px; color: var(--text-tertiary); flex-shrink: 0; }
    .msg-status {
      font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
      padding: 4px 10px; border-radius: var(--radius-sm); flex-shrink: 0;
    }
    .msg-status.replied  { background: var(--status-success-bg); color: var(--status-success); border: 1px solid var(--status-success-border); }
    .msg-status.pending  { background: rgba(99, 102, 241, 0.1); color: var(--brand-primary); border: 1px solid rgba(99, 102, 241, 0.2); }
    .msg-chevron { color: var(--text-tertiary); transition: transform 0.2s; display: flex; align-items: center; }
    .msg-card.open .msg-chevron { transform: rotate(180deg); color: var(--text-primary); }

    .msg-body {
      display: none; padding: 0 20px 20px; border-top: 1px solid var(--bg-surface-border);
      margin-top: 0;
    }
    .msg-card.open .msg-body { display: block; }

    .msg-text {
      font-size: 15px; color: var(--text-secondary); line-height: 1.6;
      white-space: pre-wrap; padding: 20px 0;
    }

    .reply-section { margin-top: 16px; background: rgba(0,0,0,0.2); padding: 20px; border-radius: var(--radius-md); border: 1px solid var(--bg-surface-border); }
    .reply-label { font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .reply-sent {
      font-size: 14px; color: var(--status-success); background: var(--status-success-bg);
      border: 1px solid var(--status-success-border); border-radius: var(--radius-md); padding: 16px;
      white-space: pre-wrap; line-height: 1.5;
    }
    .reply-form textarea {
      width: 100%; padding: 12px 16px; min-height: 120px;
      background: var(--bg-surface); border: 1px solid var(--bg-surface-border);
      border-radius: var(--radius-md); color: var(--text-primary); font-size: 14px;
      outline: none; resize: vertical; font-family: inherit;
      transition: border-color 0.2s; margin-bottom: 12px; line-height: 1.5;
    }
    .reply-form textarea:focus { border-color: var(--brand-primary); }
    .reply-form textarea::placeholder { color: var(--text-tertiary); }
    
    .reply-msg {
      font-size: 13px; margin-top: 12px; padding: 10px 14px;
      border-radius: var(--radius-sm); display: none;
    }
    .reply-history { margin-bottom: 16px; }
    .reply-history + .reply-history { border-top: 1px solid var(--bg-surface-border); padding-top: 16px; }
    .reply-history-label { font-size: 12px; color: var(--text-tertiary); margin-bottom: 8px; font-weight: 500; }
    
    .delete-btn {
      padding: 8px 16px; background: transparent; border: 1px solid var(--status-error-border);
      border-radius: var(--radius-sm); color: var(--status-error); font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all 0.2s; margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
    }
    .delete-btn:hover { background: var(--status-error-bg); }

    .empty { text-align: center; padding: 80px 24px; color: var(--text-tertiary); display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .empty h3 { font-size: 20px; font-weight: 600; color: var(--text-secondary); }

    .stats { display: flex; gap: 16px; margin-bottom: 32px; flex-wrap: wrap; }
    .stat {
      background: var(--bg-surface); border: 1px solid var(--bg-surface-border); border-radius: var(--radius-lg);
      padding: 20px 24px; flex: 1; min-width: 160px;
    }
    .stat-val { font-size: 32px; font-weight: 800; color: var(--text-primary); }
    .stat-lbl { font-size: 13px; color: var(--text-secondary); margin-top: 4px; font-weight: 500; }
  </style>
</head>
<body>

<header class="app-header">
  <a class="header-brand-link" href="/">
    <div class="header-logo"><i data-lucide="target" style="width: 22px; height: 22px;"></i></div>
    <div class="header-brand-info">
      <h1>Acing Interview</h1>
      <p>Admin panel</p>
    </div>
  </a>
  <div class="header-actions">
    <a class="nav-link" href="/admin.html"><i data-lucide="users" style="width:16px;height:16px"></i> Users</a>
    <a class="nav-link" href="/index.html"><i data-lucide="arrow-left" style="width:16px;height:16px"></i> Back to app</a>
  </div>
</header>

<main>
  <div class="page-title">
    Contact Messages 
    <span class="badge badge-primary" id="unread-badge" style="display:none; margin-left:8px; padding:4px 8px;"></span>
  </div>
  <p class="page-sub">Incoming messages from the contact form.</p>

  <div class="stats">
    <div class="stat"><div class="stat-val" id="stat-total">—</div><div class="stat-lbl"><i data-lucide="inbox" style="width:14px;height:14px;vertical-align:middle;margin-right:4px;"></i> Total</div></div>
    <div class="stat"><div class="stat-val" id="stat-pending" style="color:var(--brand-primary)">—</div><div class="stat-lbl"><i data-lucide="clock" style="width:14px;height:14px;vertical-align:middle;margin-right:4px;"></i> Pending reply</div></div>
    <div class="stat"><div class="stat-val" id="stat-replied" style="color:var(--status-success)">—</div><div class="stat-lbl"><i data-lucide="check-circle" style="width:14px;height:14px;vertical-align:middle;margin-right:4px;"></i> Replied</div></div>
  </div>

  <div class="msg-list" id="msg-list">
    <div class="empty"><span class="spinner" style="width:32px;height:32px;border-width:3px;border-top-color:var(--brand-primary);"></span></div>
  </div>
</main>

<script>
  lucide.createIcons();

  const _token = localStorage.getItem('auth_token');
  if (!_token) location.replace('/login.html?next=/admin-contact.html');
  const _headers = { 'Authorization': `Bearer ${_token}`, 'Content-Type': 'application/json' };

  function _fmtDate(ms) {
    if (!ms) return '';
    const d = new Date(ms);
    return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function _initials(name) {
    return (name || '?').split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
  }

  function _parseReplies(replyText) {
    if (!replyText) return [];
    const parts = replyText.split(/\n\n--- Reply on /);
    return parts.map((part, i) => {
      if (i === 0) return { date: null, text: part.trim() };
      const nl = part.indexOf('\n');
      const date = nl > -1 ? part.substring(0, nl).replace(/ ---$/, '').trim() : part.trim();
      const text = nl > -1 ? part.substring(nl + 1).trim() : '';
      return { date, text };
    }).filter(r => r.text);
  }

  function _buildHistoryHtml(replyText, repliedAt) {
    const replies = _parseReplies(replyText);
    if (!replies.length) return '';
    return replies.map((r, i) => {
      const label = r.date || (i === 0 && repliedAt ? _fmtDate(repliedAt) : '—');
      return `<div class="reply-history">
         <div class="reply-history-label"><i data-lucide="corner-down-right" style="width:12px;height:12px;display:inline-block;vertical-align:middle;margin-right:4px;"></i> Reply &middot; ${label}</div>
         <div class="reply-sent">${_esc(r.text)}</div>
       </div>`;
    }).join('');
  }

  function _renderMessages(messages) {
    const list  = document.getElementById('msg-list');
    const total   = messages.length;
    const pending = messages.filter(m => !m.replied_at).length;
    const replied = total - pending;

    document.getElementById('stat-total').textContent   = total;
    document.getElementById('stat-pending').textContent = pending;
    document.getElementById('stat-replied').textContent = replied;

    if (pending > 0) {
      const badge = document.getElementById('unread-badge');
      badge.textContent = pending + ' new';
      badge.style.display = 'inline-block';
    }

    if (!total) {
      list.innerHTML = '<div class="empty"><i data-lucide="inbox" style="width:48px;height:48px"></i><h3>No messages yet</h3><p>Messages submitted via the contact form will appear here.</p></div>';
      lucide.createIcons();
      return;
    }

    list.innerHTML = '';
    messages.forEach(msg => {
      const card = document.createElement('div');
      card.className = 'msg-card' + (msg.replied_at ? '' : ' unread');
      card.dataset.id = msg.id;

      const historyHtml = _buildHistoryHtml(msg.reply_text, msg.replied_at);

      card.innerHTML = `
        <div class="msg-header">
          <div class="msg-avatar">${_initials(msg.name)}</div>
          <div class="msg-meta">
            <div class="msg-from">${_esc(msg.name)}</div>
            <div class="msg-email">${_esc(msg.email)}</div>
            <div class="msg-subject">${_esc(msg.subject)}</div>
          </div>
          <div class="msg-date">${_fmtDate(msg.created_at)}</div>
          <span class="msg-status ${msg.replied_at ? 'replied' : 'pending'}"><i data-lucide="${msg.replied_at ? 'check' : 'clock'}" style="width:12px;height:12px;margin-right:4px;display:inline-block;vertical-align:middle;"></i>${msg.replied_at ? 'Replied' : 'Pending'}</span>
          <span class="msg-chevron"><i data-lucide="chevron-down" style="width:20px;height:20px;"></i></span>
        </div>
        <div class="msg-body">
          <div class="msg-text">${_esc(msg.body)}</div>
          <div class="reply-section">
            <div class="reply-label"><i data-lucide="reply" style="width:16px;height:16px;"></i> Reply to ${_esc(msg.name)}</div>
            ${historyHtml}
            <div class="reply-form">
              <textarea placeholder="Type your reply here..." id="reply-${msg.id}"></textarea>
              <div style="display:flex;align-items:center;gap:12px">
                <button class="btn btn-primary" onclick="sendReply('${msg.id}')"><i data-lucide="send" style="width:16px;height:16px"></i> Send reply</button>
                <button class="delete-btn" onclick="deleteMsg('${msg.id}')"><i data-lucide="trash-2" style="width:14px;height:14px"></i> Delete</button>
              </div>
              <div class="alert reply-msg" id="rmsg-${msg.id}"></div>
            </div>
          </div>
        </div>
      `;

      card.querySelector('.msg-header').addEventListener('click', () => {
        card.classList.toggle('open');
      });

      list.appendChild(card);
    });
    lucide.createIcons();
  }

  function _esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function sendReply(msgId) {
    const ta   = document.getElementById(`reply-${msgId}`);
    const btn  = ta.parentElement.querySelector('.btn-primary');
    const rmsg = document.getElementById(`rmsg-${msgId}`);
    const text = ta.value.trim();
    if (!text) return;

    const originalHtml = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner" style="width:14px;height:14px;margin:0;"></span> Sending...';
    rmsg.style.display = 'none';

    try {
      const res = await fetch(`/admin/contact/${msgId}/reply`, {
        method: 'POST', headers: _headers,
        body: JSON.stringify({ reply_text: text }),
      });
      if (res.ok) {
        rmsg.innerHTML = '<i data-lucide="check-circle" style="width:16px;height:16px;margin-right:8px;vertical-align:text-bottom;"></i> Reply sent successfully';
        rmsg.className = 'alert alert-success reply-msg';
        rmsg.style.display = 'block';
        lucide.createIcons();
        setTimeout(loadMessages, 1200);
      } else {
        const d = await res.json().catch(() => ({}));
        rmsg.innerHTML = `<i data-lucide="alert-circle" style="width:16px;height:16px;margin-right:8px;vertical-align:text-bottom;"></i> ${d.detail || 'Failed to send reply.'}`;
        rmsg.className = 'alert alert-error reply-msg';
        rmsg.style.display = 'block';
        lucide.createIcons();
        btn.disabled = false;
        btn.innerHTML = originalHtml;
      }
    } catch (_) {
      rmsg.innerHTML = '<i data-lucide="alert-triangle" style="width:16px;height:16px;margin-right:8px;vertical-align:text-bottom;"></i> Network error — please try again.';
      rmsg.className = 'alert alert-error reply-msg';
      rmsg.style.display = 'block';
      lucide.createIcons();
      btn.disabled = false;
      btn.innerHTML = originalHtml;
    }
  }

  async function deleteMsg(msgId) {
    if (!confirm('Delete this message? This cannot be undone.')) return;
    try {
      const res = await fetch(`/admin/contact/${msgId}`, { method: 'DELETE', headers: _headers });
      if (res.ok) {
        const card = document.querySelector(`.msg-card[data-id="${msgId}"]`);
        if (card) card.remove();
        loadMessages();
      } else {
        alert('Failed to delete message.');
      }
    } catch (_) {
      alert('Network error — please try again.');
    }
  }

  async function loadMessages() {
    try {
      const res = await fetch('/admin/contact', { headers: _headers });
      if (res.status === 403) {
        document.getElementById('msg-list').innerHTML =
          '<div class="empty"><i data-lucide="lock" style="width:48px;height:48px;color:var(--status-error);"></i><h3 style="color:var(--status-error);">Access Restricted</h3><p>This area is for administrators only.</p></div>';
        lucide.createIcons();
        return;
      }
      if (!res.ok) throw new Error('Failed to load');
      const data = await res.json();
      _renderMessages(data.messages || []);
    } catch (err) {
      document.getElementById('msg-list').innerHTML =
        `<div class="empty"><i data-lucide="alert-triangle" style="width:48px;height:48px;color:var(--status-error);"></i><h3 style="color:var(--status-error);">Error Loading Messages</h3><p>${err.message}</p></div>`;
      lucide.createIcons();
    }
  }

  loadMessages();
</script>
</body>
</html>
