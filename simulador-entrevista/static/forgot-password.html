<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — Interview Coach</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117; color: #e2e8f0;
      min-height: 100dvh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      background: #1a1d27; border: 1px solid #2d3148;
      border-radius: 16px; padding: 40px 36px;
      width: 100%; max-width: 420px;
    }
    .logo {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 14px; display: flex; align-items: center;
      justify-content: center; font-size: 24px; margin: 0 auto 20px;
    }
    h1 { font-size: 22px; font-weight: 700; color: #f1f5f9; text-align: center; margin-bottom: 6px; }
    .subtitle { font-size: 13px; color: #64748b; text-align: center; margin-bottom: 28px; }
    label { display: block; font-size: 13px; font-weight: 500; color: #94a3b8; margin-bottom: 6px; }
    input {
      width: 100%; padding: 10px 14px;
      background: #0f1117; border: 1px solid #2d3148;
      border-radius: 8px; color: #f1f5f9; font-size: 14px;
      outline: none; transition: border-color 0.2s; margin-bottom: 16px;
    }
    input:focus { border-color: #6366f1; }
    input::placeholder { color: #475569; }
    .btn {
      width: 100%; padding: 11px;
      background: linear-gradient(135deg, #6366f1, #7c3aed);
      border: none; border-radius: 8px; color: #fff;
      font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg {
      border-radius: 8px; padding: 10px 14px;
      font-size: 13px; margin-bottom: 16px; display: none;
    }
    .msg.error { background: #450a0a; border: 1px solid #7f1d1d; color: #fca5a5; }
    .msg.success { background: #14532d; border: 1px solid #166534; color: #4ade80; }
    .footer { text-align: center; font-size: 13px; color: #64748b; margin-top: 24px; }
    .footer a { color: #818cf8; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">🎯</div>
  <h1>Forgot password?</h1>
  <p class="subtitle">Enter your email and we'll send a reset link</p>

  <div class="msg" id="msg"></div>

  <form id="form">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" />
    <button class="btn" type="submit" id="submit-btn">Send reset link</button>
  </form>

  <div class="footer"><a href="/login.html">← Back to sign in</a></div>
</div>

<script>
  const form      = document.getElementById('form');
  const msgEl     = document.getElementById('msg');
  const submitBtn = document.getElementById('submit-btn');

  function showMsg(text, type) {
    msgEl.textContent = text;
    msgEl.className = `msg ${type}`;
    msgEl.style.display = 'block';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msgEl.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span>Sending…';

    const email = document.getElementById('email').value.trim();
    try {
      const res  = await fetch('/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });
      const data = await res.json();
      if (data.dev_token) {
        // Dev mode: show the link directly
        const link = `${location.origin}/reset-password.html?token=${data.dev_token}`;
        showMsg(`[DEV] Reset link: ${link}`, 'success');
      } else {
        showMsg("If that email is registered, you'll receive a reset link shortly.", 'success');
      }
      form.style.display = 'none';
    } catch {
      showMsg('Network error — please try again.', 'error');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send reset link';
    }
  });
</script>
</body>
</html>
