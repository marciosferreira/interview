<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="register.pageTitle">Create Account — Acing Interviews</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Styles -->
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  
  <script src="/i18n.js"></script>
  <!-- TikTok Pixel -->
  <script src="/tiktok-pixel.js"></script>
</head>
<body>

<div class="auth-wrapper">
  <div class="glass-card auth-card">
    <div class="auth-header">
      <a href="/" style="text-decoration:none">
        <div class="auth-header-logo">
          <i data-lucide="target"></i>
        </div>
      </a>
      <h1 data-i18n="register.title">Create your account</h1>
      <p data-i18n="register.subtitle">Practice interviews personalized to your resume</p>
    </div>

    <div class="alert alert-error" id="error-msg" style="display:none">
      <i data-lucide="alert-circle" style="width:18px;height:18px;flex-shrink:0;margin-top:1px"></i>
      <span id="error-text"></span>
    </div>

    <!-- Success state: shown after registration -->
    <div id="success-panel" style="display:none; text-align:center; padding: 8px 0 16px;">
      <div style="width:56px;height:56px;border-radius:50%;background:rgba(74,222,128,0.15);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">
        <i data-lucide="mail-check" style="width:28px;height:28px;color:#4ade80"></i>
      </div>
      <h2 id="success-title" style="font-size:1.25rem;font-weight:700;margin-bottom:10px" data-i18n="register.successTitle">Check your inbox</h2>
      <p id="success-text" style="color:var(--text-secondary);margin-bottom:16px;line-height:1.6"></p>
      <p style="font-size:13px;color:var(--text-tertiary)">
        <span id="success-note" data-i18n="register.successNote">Didn't receive it? Check your spam folder or</span>
        <a href="#" id="resend-link" data-i18n="register.successResend" style="color:var(--accent);text-decoration:underline;cursor:pointer">resend the email</a>.
      </p>
      <p id="resend-status" style="font-size:12px;color:var(--text-tertiary);margin-top:8px;display:none"></p>
    </div>

    <form id="register-form" autocomplete="on">
      <div class="form-group">
        <label class="form-label" for="name" data-i18n="register.name">Full name</label>
        <input class="form-input" type="text" id="name" name="name" data-i18n-attr="placeholder:register.namePlaceholder" placeholder="Alex Johnson" required autocomplete="name" />
      </div>

      <div class="form-group">
        <label class="form-label" for="email" data-i18n="register.email">Email</label>
        <input class="form-input" type="email" id="email" name="email" data-i18n-attr="placeholder:register.emailPlaceholder" placeholder="you@example.com" required autocomplete="email" />
      </div>

      <div class="form-group">
        <label class="form-label" for="password" data-i18n="register.password">Password</label>
        <input class="form-input" type="password" id="password" name="password" data-i18n-attr="placeholder:register.passwordPlaceholder" placeholder="At least 8 characters" required autocomplete="new-password" />
        <p style="font-size:11px; margin-top:4px; color:var(--text-tertiary)" data-i18n="register.passwordHint">Minimum 8 characters</p>
      </div>

      <div class="form-group">
        <label class="form-label" for="language" data-i18n="register.language">Interview language</label>
        <select class="form-input" id="language" name="language" style="appearance:none; padding-right:32px; background-image:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2216%22 height=%2216%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%2394a3b8%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><polyline points=%226 9 12 15 18 9%22></polyline></svg>'); background-repeat:no-repeat; background-position:right 12px center;">
          <option value="en" selected data-i18n="register.langEn">English</option>
          <option value="pt" data-i18n="register.langPt">Portuguese</option>
        </select>
      </div>

      <button class="btn btn-primary" style="width:100%; margin-top:8px;" type="submit" id="submit-btn" data-i18n="register.submit">Create account</button>
    </form>

    <div class="auth-footer">
      <span data-i18n="register.haveAccount">Already have an account?</span> <a href="/login.html" data-i18n="register.signIn">Sign in &rarr;</a>
    </div>

    <div class="flex justify-center mt-6">
      <div class="lang-switcher">
        <button class="lang-btn" data-lang="en" onclick="i18n.switchLang('en')">EN</button>
        <button class="lang-btn" data-lang="pt" onclick="i18n.switchLang('pt')">PT</button>
      </div>
    </div>
  </div>
</div>

<script>
  lucide.createIcons();

  const token = localStorage.getItem('auth_token');
  if (token) { location.replace('/index.html'); }

  const form         = document.getElementById('register-form');
  const errorMsg     = document.getElementById('error-msg');
  const errorText    = document.getElementById('error-text');
  const submitBtn    = document.getElementById('submit-btn');
  const successPanel = document.getElementById('success-panel');
  const successText  = document.getElementById('success-text');
  const resendLink   = document.getElementById('resend-link');
  const resendStatus = document.getElementById('resend-status');

  let registeredEmail = '';

  function showError(msg) {
    errorText.textContent = msg;
    errorMsg.style.display = 'flex';
  }

  function showSuccess(email) {
    registeredEmail = email;
    const tpl = (window.t ? window.t('register.successText') : 'We sent a confirmation link to {email}. Click it to activate your account.');
    successText.textContent = tpl.replace('{email}', email);
    form.style.display = 'none';
    successPanel.style.display = 'block';
    lucide.createIcons();
  }

  resendLink.addEventListener('click', async (e) => {
    e.preventDefault();
    if (!registeredEmail) return;
    resendLink.style.pointerEvents = 'none';
    resendStatus.style.display = 'block';
    resendStatus.textContent = '...';
    try {
      const res = await fetch('/auth/resend-verification-public', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: registeredEmail }),
      });
      if (res.status === 429) {
        const data = await res.json();
        const secs = data.detail?.wait_seconds;
        const tpl = window.t ? window.t('register.errorResendWait') : 'Please wait {seconds} seconds before requesting another email.';
        resendStatus.textContent = secs ? tpl.replace('{seconds}', secs) : (window.t ? window.t('register.errorResendWaitGeneric') : 'Please wait a moment before requesting another email.');
        setTimeout(() => { resendLink.style.pointerEvents = ''; resendStatus.style.display = 'none'; }, 10000);
      } else {
        resendStatus.textContent = window.t ? window.t('register.successResendOk') : 'Email resent!';
        setTimeout(() => { resendLink.style.pointerEvents = ''; }, 30000);
      }
    } catch {
      resendStatus.textContent = window.t ? window.t('register.errorNetwork') : 'Network error';
      resendLink.style.pointerEvents = '';
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span>' + (window.t ? window.t('register.creating') : 'Creating account...');

    const name     = document.getElementById('name').value.trim();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const language = document.getElementById('language').value;

    if (!name) { showError(window.t ? window.t('register.errorName') : 'Name required'); submitBtn.disabled = false; submitBtn.textContent = window.t ? window.t('register.submit') : 'Create account'; return; }
    if (password.length < 8) { showError(window.t ? window.t('register.errorPassword') : 'Password too short'); submitBtn.disabled = false; submitBtn.textContent = window.t ? window.t('register.submit') : 'Create account'; return; }

    try {
      const res = await fetch('/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password, language }),
      });
      const data = await res.json();
      if (!res.ok) {
        showError(data.detail || (window.t ? window.t('register.errorDefault') : 'Error occurred'));
        return;
      }
      localStorage.setItem('preferred_lang', language);
      showSuccess(data.email || email);
    } catch (err) {
      showError(window.t ? window.t('register.errorNetwork') : 'Network error');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = window.t ? window.t('register.submit') : 'Create account';
    }
  });
</script>
<script src="/contact-widget.js"></script>
</body>
</html>
