<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — Interview Coach</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
    }
    .logo {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      margin: 0 auto 20px;
    }
    h1 { font-size: 22px; font-weight: 700; color: #f1f5f9; text-align: center; margin-bottom: 6px; }
    .subtitle { font-size: 13px; color: #64748b; text-align: center; margin-bottom: 28px; }
    label { display: block; font-size: 13px; font-weight: 500; color: #94a3b8; margin-bottom: 6px; }
    input, select {
      width: 100%; padding: 10px 14px;
      background: #0f1117; border: 1px solid #2d3148;
      border-radius: 8px; color: #f1f5f9; font-size: 14px;
      outline: none; transition: border-color 0.2s;
      margin-bottom: 16px;
    }
    input:focus, select:focus { border-color: #6366f1; }
    input::placeholder { color: #475569; }
    select option { background: #1a1d27; }
    .btn {
      width: 100%; padding: 11px;
      background: linear-gradient(135deg, #6366f1, #7c3aed);
      border: none; border-radius: 8px;
      color: #fff; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: opacity 0.2s; margin-top: 4px;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .error {
      background: #450a0a; border: 1px solid #7f1d1d;
      color: #fca5a5; border-radius: 8px;
      padding: 10px 14px; font-size: 13px;
      margin-bottom: 16px; display: none;
    }
    .footer { text-align: center; font-size: 13px; color: #64748b; margin-top: 24px; }
    .footer a { color: #818cf8; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hint { font-size: 11px; color: #475569; margin-top: -12px; margin-bottom: 16px; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">🎯</div>
  <h1>Create your account</h1>
  <p class="subtitle">Practice interviews personalized to your resume and target role</p>

  <div class="error" id="error-msg"></div>

  <form id="register-form" autocomplete="on">
    <label for="name">Full name</label>
    <input type="text" id="name" name="name" placeholder="Alex Johnson" required autocomplete="name" />

    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email" />

    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="At least 8 characters" required autocomplete="new-password" />
    <p class="hint">Minimum 8 characters</p>

    <label for="language">Interview language</label>
    <select id="language" name="language">
      <option value="en" selected>English</option>
      <option value="pt">Portuguese (coming soon)</option>
    </select>

    <button class="btn" type="submit" id="submit-btn">Create account</button>
  </form>

  <div class="footer">
    Already have an account? <a href="/login.html">Sign in →</a>
  </div>
</div>

<script>
  // If already logged in, redirect
  const token = localStorage.getItem('auth_token');
  if (token) { location.replace('/index.html'); }

  const form      = document.getElementById('register-form');
  const errorMsg  = document.getElementById('error-msg');
  const submitBtn = document.getElementById('submit-btn');

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.style.display = 'block';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span>Creating account…';

    const name     = document.getElementById('name').value.trim();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const language = document.getElementById('language').value;

    if (!name) { showError('Name is required.'); submitBtn.disabled = false; submitBtn.textContent = 'Create account'; return; }
    if (password.length < 8) { showError('Password must be at least 8 characters.'); submitBtn.disabled = false; submitBtn.textContent = 'Create account'; return; }

    try {
      const res = await fetch('/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password, language }),
      });
      const data = await res.json();
      if (!res.ok) {
        showError(data.detail || 'Registration failed. Please try again.');
        return;
      }
      localStorage.setItem('auth_token', data.access_token);
      localStorage.setItem('auth_user', JSON.stringify(data.user));
      // New user → go straight to onboarding
      location.replace('/onboarding.html');
    } catch (err) {
      showError('Network error — please try again.');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Create account';
    }
  });
</script>
</body>
</html>
