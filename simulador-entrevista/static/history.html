<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="history.pageTitle">Interview History — Acing Interviews</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Styles -->
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  
  <script src="/i18n.js"></script>
  
  <style>
    main {
      flex: 1;
      padding: 40px 24px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }
    .page-title { font-size: 24px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; }
    .page-sub   { font-size: 14px; color: var(--text-secondary); margin-bottom: 32px; }

    /* Role group */
    .role-group { margin-bottom: 32px; }
    .role-header {
      display: flex; align-items: center; gap: 16px;
      margin-bottom: 16px; padding-bottom: 16px;
      border-bottom: 1px solid var(--bg-surface-border);
    }
    .role-icon {
      width: 48px; height: 48px; border-radius: var(--radius-md);
      background: rgba(99, 102, 241, 0.1); border: 1px solid rgba(99, 102, 241, 0.2);
      display: flex; align-items: center; justify-content: center;
      color: var(--brand-primary); flex-shrink: 0;
    }
    .role-info { flex: 1; min-width: 0; }
    .role-title { font-size: 18px; font-weight: 700; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .role-company { font-size: 14px; color: var(--brand-primary); font-weight: 500; margin-top: 2px; }
    .role-count { font-size: 12px; color: var(--text-tertiary); margin-top: 4px; }
    
    /* Session List */
    .session-list { display: flex; flex-direction: column; gap: 12px; }
    .session-card {
      padding: 16px 20px;
      display: flex; align-items: center; gap: 16px;
      cursor: pointer;
    }
    .session-icon {
      width: 40px; height: 40px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .session-icon.done { background: var(--status-success-bg); color: var(--status-success); border: 1px solid var(--status-success-border); }
    .session-icon.progress { background: rgba(99, 102, 241, 0.1); color: var(--brand-primary); border: 1px solid rgba(99, 102, 241, 0.2); }
    
    .session-body { flex: 1; min-width: 0; }
    .session-row1 { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; flex-wrap: wrap; }
    .session-date { font-size: 14px; font-weight: 600; color: var(--text-primary); }
    
    .session-row2 { display: flex; align-items: center; gap: 10px; }
    .session-phase { font-size: 13px; color: var(--text-secondary); }
    .session-msgs { font-size: 12px; color: var(--text-tertiary); }
    
    .session-actions { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    
    .delete-btn {
      background: transparent; border: none; color: var(--text-tertiary);
      padding: 6px; border-radius: var(--radius-sm); cursor: pointer; transition: all 0.2s;
    }
    .session-card:hover .delete-btn { color: var(--status-error); background: var(--status-error-bg); }

    /* Empty state */
    .empty-state { text-align: center; padding: 80px 24px; }
    .empty-icon { width: 64px; height: 64px; margin: 0 auto 24px; color: var(--text-tertiary); background: var(--bg-surface); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .empty-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .empty-sub { font-size: 15px; color: var(--text-secondary); margin-bottom: 24px; }
  </style>
  <!-- TikTok Pixel -->
  <script src="/tiktok-pixel.js"></script>
</head>
<body>

<!-- Global Header -->
<header class="app-header">
  <a class="header-brand-link" href="/">
    <div class="header-logo"><i data-lucide="target" style="width: 22px; height: 22px;"></i></div>
    <div class="header-brand-info">
      <h1>Acing Interviews</h1>
      <p data-i18n="history.header.tagline">Interview history</p>
    </div>
  </a>
  
  <div class="header-actions">
    <span id="plan-pill" class="badge"></span>
    <button class="btn btn-primary" style="padding: 6px 12px; font-size: 13px;" onclick="newInterview()">
      <i data-lucide="plus" style="width:16px;height:16px"></i> <span data-i18n="history.nav.newInterview">New interview</span>
    </button>
    <a href="/tips.html" class="nav-link"><i data-lucide="lightbulb" style="width:16px;height:16px;"></i> <span data-i18n="nav.tipsLabel">Tips</span></a>
    <a href="/profile.html" class="nav-link"><i data-lucide="settings" style="width:16px;height:16px;"></i> <span data-i18n="nav.settingsLabel">Settings</span></a>
  </div>
  
  <button class="mobile-menu-btn" id="hamburger-btn" aria-label="Menu"><i data-lucide="menu"></i></button>
</header>

<div id="mobile-drawer">
  <div class="drawer-backdrop" onclick="closeMobileMenu()"></div>
  <nav class="drawer-panel">
    <div class="drawer-header">
      <span>Menu</span>
      <button class="drawer-close" onclick="closeMobileMenu()"><i data-lucide="x"></i></button>
    </div>
    <a class="drawer-item" href="/"><i data-lucide="home"></i> <span data-i18n="nav.homeLabel">Home</span></a>
    <button class="drawer-item" onclick="closeMobileMenu(); newInterview()"><i data-lucide="plus"></i> <span data-i18n="history.nav.newInterview">New interview</span></button>
    <a class="drawer-item" href="/tips.html"><i data-lucide="lightbulb"></i> <span data-i18n="nav.tipsLabel">Tips</span></a>
    <a class="drawer-item" href="/profile.html"><i data-lucide="settings"></i> <span data-i18n="nav.settingsLabel">Settings</span></a>
  </nav>
</div>

<main>
  <div class="page-title" data-i18n="history.pageHeading">Past interviews</div>
  <div class="page-sub" id="page-sub"></div>
  <div id="session-list">
    <div id="loading-spinner" style="display:flex;justify-content:center;align-items:center;height:200px;">
      <div style="width:36px;height:36px;border:3px solid var(--border-color,#2a2d3e);border-top-color:var(--brand-primary,#6366f1);border-radius:50%;animation:spin 0.8s linear infinite;"></div>
    </div>
  </div>
</main>
<style>
  @keyframes spin { to { transform: rotate(360deg); } }
</style>

<script>
  lucide.createIcons();

  const _authToken = localStorage.getItem('auth_token');
  if (!_authToken) location.replace('/login.html?next=/history.html');

  const SESSION_KEY = 'interview_v1';
  let _sessionList  = [];

  function getFaseLabel(fase) {
    const key = 'history.phases.' + fase;
    const val = t(key);
    return val !== key ? val : (fase || t('history.phases.starting'));
  }

  function _fmt(ts) {
    if (!ts) return '—';
    const d = new Date(ts), now = new Date();
    const diffDays = Math.floor((now - d) / 86400000);
    const time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    if (diffDays === 0) return t('history.date.today', { time });
    if (diffDays === 1) return t('history.date.yesterday', { time });
    return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ` ${t('history.date.at')} ${time}`;
  }

  function _msgCount(history) {
    if (!history) return 0;
    return history.filter(m => m.type === 'user').length;
  }

  function _escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function _groupByRole(sessions) {
    const groups = new Map();
    for (const s of sessions) {
      const key = (s.jobTitle || '') + '|' + (s.company || '');
      if (!groups.has(key)) {
        groups.set(key, {
          jobTitle:     s.jobTitle     || '',
          company:      s.company      || '',
          jobSessionId: s.jobSessionId || '',
          sessions:     [],
        });
      }
      groups.get(key).sessions.push(s);
    }
    return [...groups.values()].sort((a, b) => {
      const aLast = Math.max(...a.sessions.map(s => s.startedAt || 0));
      const bLast = Math.max(...b.sessions.map(s => s.startedAt || 0));
      return bLast - aLast;
    });
  }

  async function deleteSession(threadId) {
    try {
      await fetch(`/sessions/${encodeURIComponent(threadId)}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${_authToken}` },
      });
    } catch {}
    const active = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    if (active?.threadId === threadId) localStorage.removeItem(SESSION_KEY);
    render();
  }

  function openSession(threadId) {
    const s = _sessionList.find(s => s.threadId === threadId);
    if (!s) return;
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      threadId:     s.threadId,
      savedAt:      Date.now(),
      startedAt:    s.startedAt,
      fase:         s.fase         || '',
      history:      s.history      || [],
      jobSessionId: s.jobSessionId || '',
      jobTitle:     s.jobTitle     || '',
      company:      s.company      || '',
    }));
    window.location.href = '/interview.html';
  }

  function practiceAgain(jobSessionId, jobTitle, company) {
    if (!jobSessionId) { newInterview(); return; }
    localStorage.setItem('pending_job_session', JSON.stringify({ jobSessionId, jobTitle, company }));
    localStorage.removeItem(SESSION_KEY);
    window.location.href = '/interview.html';
  }

  function newInterview() {
    localStorage.removeItem(SESSION_KEY);
    window.location.href = '/onboarding.html';
  }

  function _buildSessionCard(s) {
    const isDone    = s.fase === 'done';
    const phaseText = getFaseLabel(s.fase);
    const turns     = _msgCount(s.history);

    const card = document.createElement('div');
    card.className = 'glass-card session-card glass-card-hover';
    card.onclick   = () => openSession(s.threadId);
    card.innerHTML = `
      <div class="session-icon ${isDone ? 'done' : 'progress'}">
        <i data-lucide="${isDone ? 'check-circle' : 'mic'}" style="width:20px;height:20px;"></i>
      </div>
      <div class="session-body">
        <div class="session-row1">
          <span class="session-date">${_fmt(s.startedAt)}</span>
          <span class="badge ${isDone ? 'badge-primary' : ''}" style="${isDone ? 'background:var(--status-success-bg);color:var(--status-success);border-color:var(--status-success-border)' : ''}">${isDone ? t('history.badges.completed') : t('history.badges.inProgress')}</span>
        </div>
        <div class="session-row2">
          <span class="session-phase">${_escHtml(phaseText)}</span>
          <span class="session-msgs">· ${turns} ${turns !== 1 ? t('history.session.answers') : t('history.session.answer')}</span>
        </div>
      </div>
      <div class="session-actions">
        ${isDone ? `<button class="btn btn-secondary scorecard-btn" style="padding: 6px 12px; font-size: 12px;" title="Scorecard">
          <i data-lucide="bar-chart-2" style="width:14px;height:14px"></i> ${t('history.session.scorecard')}
        </button>` : ''}
        <button class="btn btn-secondary" style="padding: 6px 12px; font-size: 12px; pointer-events: none;">
          ${isDone ? t('history.session.review') : t('history.session.continue')} <i data-lucide="chevron-right" style="width:14px;height:14px"></i>
        </button>
        <button class="delete-btn" title="Delete">
          <i data-lucide="trash-2" style="width:16px;height:16px"></i>
        </button>
      </div>`;

    card.querySelector('.delete-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      deleteSession(s.threadId);
    });
    card.querySelector('.scorecard-btn')?.addEventListener('click', (e) => {
      e.stopPropagation();
      window.location.href = `/scorecard/${s.threadId}`;
    });
    return card;
  }

  async function render() {
    const listEl  = document.getElementById('session-list');
    const subEl   = document.getElementById('page-sub');

    try {
      const res = await fetch('/sessions', { headers: { 'Authorization': `Bearer ${_authToken}` } });
      _sessionList = res.ok ? await res.json() : [];
    } catch { _sessionList = []; }

    if (!_sessionList.length) {
      subEl.textContent = '';
      listEl.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon"><i data-lucide="clipboard-x" style="width:32px;height:32px"></i></div>
          <div class="empty-title">${_escHtml(t('history.empty.title'))}</div>
          <div class="empty-sub">${_escHtml(t('history.empty.sub'))}</div>
          <a class="btn btn-primary" href="/onboarding.html">${_escHtml(t('history.empty.start'))}</a>
        </div>`;
      lucide.createIcons();
      return;
    }

    const groups = _groupByRole(_sessionList);
    const totalRoles = groups.filter(g => g.jobTitle).length;
    subEl.textContent = t('history.summary', { count: _sessionList.length, roles: totalRoles });

    listEl.innerHTML = '';

    for (const group of groups) {
      const isUnknown = !group.jobTitle;
      const groupEl   = document.createElement('div');
      groupEl.className = 'role-group';

      const completedCount = group.sessions.filter(s => s.fase === 'done').length;
      const total          = group.sessions.length;

      const header = document.createElement('div');
      header.className = 'role-header';
      header.innerHTML = `
        <div class="role-icon" ${isUnknown ? 'style="background:var(--bg-surface);color:var(--text-tertiary);border-color:var(--bg-surface-border)"' : ''}>
          <i data-lucide="${isUnknown ? 'help-circle' : 'briefcase'}" style="width:24px;height:24px"></i>
        </div>
        <div class="role-info">
          <div class="role-title" ${isUnknown ? 'style="color:var(--text-secondary);font-style:italic"' : ''}>${_escHtml(group.jobTitle || t('history.noRoleInfo'))}</div>
          ${group.company ? `<div class="role-company">${_escHtml(group.company)}</div>` : ''}
          <div class="role-count">${t('history.roleCount', { total, completed: completedCount })}</div>
        </div>
        <div class="role-actions">
          ${!isUnknown && group.jobSessionId
            ? `<button class="btn btn-secondary practice-btn" style="padding: 6px 12px; font-size: 12px;" data-jid="${_escHtml(group.jobSessionId)}" data-title="${_escHtml(group.jobTitle)}" data-company="${_escHtml(group.company)}"><i data-lucide="refresh-cw" style="width:14px;height:14px"></i> ${_escHtml(t('history.session.practiceAgain'))}</button>`
            : ''}
        </div>`;

      header.querySelector('.practice-btn')?.addEventListener('click', (e) => {
        e.stopPropagation();
        const btn = e.currentTarget;
        practiceAgain(btn.dataset.jid, btn.dataset.title, btn.dataset.company);
      });

      groupEl.appendChild(header);

      const sessionListEl = document.createElement('div');
      sessionListEl.className = 'session-list';
      const sorted = [...group.sessions].sort((a, b) => (b.startedAt || 0) - (a.startedAt || 0));
      for (const s of sorted) sessionListEl.appendChild(_buildSessionCard(s));
      groupEl.appendChild(sessionListEl);

      listEl.appendChild(groupEl);
    }
    lucide.createIcons();
  }

  document.addEventListener('i18n:ready', render);

  // Load user plan info
  (async function(){
    try {
      const res = await fetch('/auth/usage', { headers: { 'Authorization': 'Bearer ' + _authToken } });
      if (!res.ok) return;
      const usage = await res.json();
      const el = document.getElementById('plan-pill');
      if (!el) return;
      const isHunter = usage.plan === 'hunter';
      el.className = 'badge ' + (isHunter ? 'badge-primary' : '');
      el.innerHTML = isHunter ? '<i data-lucide="target" style="width:12px;height:12px;margin-right:4px"></i> Hunter' : '<i data-lucide="map" style="width:12px;height:12px;margin-right:4px"></i> Explorer';
      el.setAttribute('data-tooltip', isHunter ? 'Your current plan' : 'Upgrade to Hunter for more sessions');
      if(!isHunter) {
        el.style.border = '1px solid var(--bg-surface-border)';
        el.style.color = 'var(--text-secondary)';
      }
      el.style.cursor = 'pointer';
      el.addEventListener('click', () => location.href = '/upgrade.html');
      lucide.createIcons();
    } catch(_){}
  })();
</script>
<script src="/mobile-menu.js"></script>
<script src="/contact-widget.js"></script>
</body>
</html>
