<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mock Interview Simulator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      padding: 14px 24px;
      background: #1a1d27;
      border-bottom: 1px solid #2d3148;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    header .logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    header h1 { font-size: 16px; font-weight: 600; color: #f1f5f9; }
    header p  { font-size: 12px; color: #64748b; margin-top: 1px; }
    #status-badge {
      margin-left: auto;
      font-size: 11px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 20px;
      background: #1e293b;
      color: #64748b;
      transition: all 0.3s;
    }
    #status-badge.connected   { background: #14532d; color: #4ade80; }
    #status-badge.recording   { background: #450a0a; color: #f87171; }
    #status-badge.processing  { background: #1e1b4b; color: #a78bfa; }

    /* ── Chat area ── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    #chat::-webkit-scrollbar { width: 6px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: #2d3148; border-radius: 3px; }

    .bubble-row {
      display: flex;
      gap: 10px;
      max-width: 780px;
      width: 100%;
    }
    .bubble-row.ai       { align-self: flex-start; }
    .bubble-row.user     { align-self: flex-end; flex-direction: row-reverse; }
    .bubble-row.feedback { align-self: center; width: 100%; max-width: 820px; }

    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 600;
    }
    .avatar.ai   { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; }
    .avatar.user { background: #1e3a5f; color: #93c5fd; }

    .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
      max-width: 100%;
    }
    .bubble-row.ai   .bubble { background: #1e2235; border-top-left-radius: 4px; }
    .bubble-row.user .bubble { background: #1e3a5f; border-top-right-radius: 4px; color: #bfdbfe; }

    /* Feedback card */
    .feedback-card {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
    }
    .feedback-card pre {
      white-space: pre-wrap;
      font-family: "SF Mono", "Fira Code", "Consolas", monospace;
      font-size: 13px;
      line-height: 1.7;
      color: #94a3b8;
    }

    /* Typing indicator */
    .typing-indicator {
      display: flex; align-items: center; gap: 5px;
      padding: 12px 16px;
      background: #1e2235;
      border-radius: 16px;
      border-top-left-radius: 4px;
      width: fit-content;
    }
    .typing-indicator span {
      width: 7px; height: 7px;
      background: #6366f1;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: .5; }
      30%            { transform: translateY(-6px); opacity: 1; }
    }

    /* ── Input area ── */
    #input-area {
      padding: 16px;
      background: #1a1d27;
      border-top: 1px solid #2d3148;
      flex-shrink: 0;
    }
    #input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      max-width: 820px;
      margin: 0 auto;
    }
    #text-input {
      flex: 1;
      background: #0f1117;
      border: 1px solid #2d3148;
      border-radius: 12px;
      padding: 12px 16px;
      color: #e2e8f0;
      font-size: 14px;
      resize: none;
      outline: none;
      min-height: 48px;
      max-height: 140px;
      transition: border-color 0.2s;
      line-height: 1.5;
    }
    #text-input:focus    { border-color: #6366f1; }
    #text-input:disabled { opacity: 0.4; cursor: not-allowed; }
    #text-input::placeholder { color: #475569; }

    .icon-btn {
      width: 48px; height: 48px;
      border: none; border-radius: 12px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      font-size: 20px;
      transition: all 0.2s;
    }
    #mic-btn {
      background: #1e2235;
      color: #94a3b8;
    }
    #mic-btn:hover    { background: #2d3148; color: #e2e8f0; }
    #mic-btn.active   { background: #450a0a; color: #f87171; animation: pulse 1.5s infinite; }
    #mic-btn:disabled { opacity: 0.3; cursor: not-allowed; animation: none; }

    #send-btn {
      background: #6366f1;
      color: #fff;
    }
    #send-btn:hover    { background: #4f46e5; }
    #send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,.4); }
      50%       { box-shadow: 0 0 0 8px rgba(239,68,68,0); }
    }

    #hint {
      font-size: 11px;
      color: #475569;
      text-align: center;
      margin-top: 8px;
    }

    /* Done banner */
    #done-banner {
      display: none;
      text-align: center;
      padding: 12px;
      background: #14532d;
      color: #4ade80;
      font-size: 13px;
      font-weight: 500;
      border-radius: 8px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">🎤</div>
  <div>
    <h1>Mock Interview Simulator</h1>
    <p>Practice your tech interview in English</p>
  </div>
  <div id="status-badge">Connecting…</div>
</header>

<div id="chat"></div>

<div id="input-area">
  <div id="done-banner">Interview complete — check your feedback above!</div>
  <div id="input-row">
    <button id="mic-btn" class="icon-btn" disabled title="Hold to speak">🎙️</button>
    <textarea id="text-input" placeholder="Type your answer or press 🎙️ to speak…"
              rows="1" disabled></textarea>
    <button id="send-btn" class="icon-btn" disabled title="Send (Enter)">➤</button>
  </div>
  <p id="hint">Hold <strong>🎙️</strong> to speak · Release to send · <strong>Enter</strong> to send text · <strong>Shift+Enter</strong> for new line</p>
</div>

<script>
  const chat      = document.getElementById('chat');
  const input     = document.getElementById('text-input');
  const micBtn    = document.getElementById('mic-btn');
  const sendBtn   = document.getElementById('send-btn');
  const badge     = document.getElementById('status-badge');
  const doneBanner = document.getElementById('done-banner');

  let ws = null;
  let mediaRecorder = null;
  let audioChunks = [];
  let typingEl = null;
  let currentAudio = null;

  // ── TTS ───────────────────────────────────────────────────────────────
  async function speak(text) {
    // Stop any audio still playing
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }

    try {
      const res = await fetch(`/tts?text=${encodeURIComponent(text)}`);
      if (!res.ok) return;
      const blob = await res.blob();
      const url  = URL.createObjectURL(blob);
      const audio = new Audio(url);
      currentAudio = audio;
      await new Promise((resolve) => {
        audio.onended = resolve;
        audio.onerror = resolve;   // don't block on error
        audio.play().catch(resolve);
      });
      URL.revokeObjectURL(url);
      currentAudio = null;
    } catch (err) {
      console.error('TTS error:', err);
    }
  }

  // ── STT via MediaRecorder + Whisper ──────────────────────────────────
  // Records raw audio while button is held; transcribes on release via Whisper.
  // No silence detection — full control over start/stop.

  async function startRecording() {
    if (micBtn.disabled) return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioChunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.start();

      micBtn.classList.add('active');
      badge.textContent = '🔴 Recording';
      badge.className = 'recording';
      input.placeholder = 'Recording… release to send';
      input.value = '';
    } catch (err) {
      console.error('Mic error:', err);
    }
  }

  async function stopRecording() {
    if (!mediaRecorder || mediaRecorder.state === 'inactive') return;

    mediaRecorder.stop();
    mediaRecorder.stream.getTracks().forEach(t => t.stop());

    micBtn.classList.remove('active');
    badge.textContent = 'Transcribing…';
    badge.className = 'processing';
    input.placeholder = 'Transcribing…';

    // Wait for the final dataavailable event before reading chunks
    await new Promise(r => mediaRecorder.addEventListener('stop', r, { once: true }));

    const blob = new Blob(audioChunks, { type: 'audio/webm' });
    const form = new FormData();
    form.append('audio', blob, 'recording.webm');

    try {
      const res  = await fetch('/stt', { method: 'POST', body: form });
      const data = await res.json();
      input.value = data.text || '';
      autoResize();
      badge.textContent = 'Connected';
      badge.className = 'connected';
      input.placeholder = 'Type or hold 🎙️ to speak…';
      if (input.value.trim()) sendMessage();
    } catch (err) {
      console.error('STT error:', err);
      badge.textContent = 'Connected';
      badge.className = 'connected';
      input.placeholder = 'Type or hold 🎙️ to speak…';
    }
  }

  // ── WebSocket ─────────────────────────────────────────────────────────
  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws`);

    ws.onopen = () => {
      badge.textContent = 'Connected';
      badge.className = 'connected';
    };

    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      removeTyping();

      switch (msg.type) {
        case 'ai':
          addBubble('ai', msg.text);
          // Speak question, then enable input so user can't interrupt mid-sentence
          speak(msg.text).then(() => enableInput());
          break;

        case 'transition':
          addBubble('ai', msg.text);
          speak(msg.text);     // fire-and-forget — graph keeps running in parallel
          showTyping(true);
          break;

        case 'user':
          // Echoed back from server — already shown optimistically, ignore
          break;

        case 'feedback':
          addFeedback(msg.text);
          break;

        case 'done':
          doneBanner.style.display = 'block';
          disableInput(true);
          badge.textContent = 'Done';
          badge.className = '';
          break;
      }
    };

    ws.onclose = () => {
      badge.textContent = 'Disconnected';
      badge.className = '';
      disableInput(true);
    };

    ws.onerror = () => {
      badge.textContent = 'Error';
      badge.className = '';
    };
  }

  // ── UI helpers ────────────────────────────────────────────────────────
  function addBubble(role, text) {
    const row = document.createElement('div');
    row.className = `bubble-row ${role}`;

    const avatar = document.createElement('div');
    avatar.className = `avatar ${role}`;
    avatar.textContent = role === 'ai' ? 'I' : 'Y';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    row.appendChild(avatar);
    row.appendChild(bubble);
    chat.appendChild(row);
    scrollBottom();
  }

  function addFeedback(text) {
    const row = document.createElement('div');
    row.className = 'bubble-row feedback';

    const card = document.createElement('div');
    card.className = 'feedback-card';

    const pre = document.createElement('pre');
    pre.textContent = text;
    card.appendChild(pre);
    row.appendChild(card);
    chat.appendChild(row);
    scrollBottom();
  }

  function showTyping(visible) {
    if (!visible) return;
    if (typingEl) return;

    const row = document.createElement('div');
    row.className = 'bubble-row ai';
    row.id = 'typing-row';

    const avatar = document.createElement('div');
    avatar.className = 'avatar ai';
    avatar.textContent = 'I';

    const indicator = document.createElement('div');
    indicator.className = 'typing-indicator';
    indicator.innerHTML = '<span></span><span></span><span></span>';

    row.appendChild(avatar);
    row.appendChild(indicator);
    chat.appendChild(row);
    typingEl = row;
    scrollBottom();
  }

  function removeTyping() {
    if (typingEl) { typingEl.remove(); typingEl = null; }
  }

  function scrollBottom() {
    chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
  }

  function enableInput() {
    input.disabled = false;
    sendBtn.disabled = false;
    micBtn.disabled = false;
    input.focus();
    badge.textContent = 'Connected';
    badge.className = 'connected';
  }

  function disableInput(permanent = false) {
    input.disabled = true;
    sendBtn.disabled = true;
    micBtn.disabled = true;
    if (!permanent) {
      badge.textContent = 'Processing…';
      badge.className = 'processing';
    }
  }

  function autoResize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  }

  // ── Send ──────────────────────────────────────────────────────────────
  function sendMessage() {
    const text = input.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

    addBubble('user', text);
    ws.send(JSON.stringify({ text }));
    input.value = '';
    input.style.height = 'auto';
    disableInput();
    showTyping(true);
  }

  // ── Events ────────────────────────────────────────────────────────────
  sendBtn.addEventListener('click', sendMessage);

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  input.addEventListener('input', autoResize);

  // Push-to-talk via MediaRecorder — no silence detection, full control.
  micBtn.addEventListener('mousedown', startRecording);
  micBtn.addEventListener('mouseup',   stopRecording);
  micBtn.addEventListener('mouseleave', stopRecording);

  micBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); });
  micBtn.addEventListener('touchend',   (e) => { e.preventDefault(); stopRecording(); });

  // ── Boot ──────────────────────────────────────────────────────────────
  connect();
  showTyping(true);   // waiting for first AI message
</script>
</body>
</html>
