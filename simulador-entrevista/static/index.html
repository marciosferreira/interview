<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mock Interview Simulator</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      padding: 14px 24px;
      background: #1a1d27;
      border-bottom: 1px solid #2d3148;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    header .logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    header h1 { font-size: 16px; font-weight: 600; color: #f1f5f9; }
    header p  { font-size: 12px; color: #64748b; margin-top: 1px; }
    #status-badge {
      margin-left: auto;
      font-size: 11px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 20px;
      background: #1e293b;
      color: #64748b;
      transition: all 0.3s;
    }
    #status-badge.connected   { background: #14532d; color: #4ade80; }
    #status-badge.recording   { background: #450a0a; color: #f87171; }
    #status-badge.processing  { background: #1e1b4b; color: #a78bfa; }

    /* ── Phase progress bar ── */
    #phase-bar {
      background: #13151f;
      border-bottom: 1px solid #2d3148;
      padding: 0 24px;
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    #phase-bar::-webkit-scrollbar { display: none; }
    .phase-steps {
      display: flex;
      align-items: center;
      max-width: 820px;
      margin: 0 auto;
      height: 36px;
    }
    .phase-step {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      cursor: default;
    }
    .phase-step .ps-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #2d3148;
      transition: background 0.3s;
      flex-shrink: 0;
    }
    .phase-step .ps-label {
      font-size: 10px;
      color: #475569;
      font-weight: 500;
      letter-spacing: 0.02em;
      transition: color 0.3s;
      white-space: nowrap;
    }
    .phase-step.active .ps-dot  { background: #6366f1; box-shadow: 0 0 6px #6366f180; }
    .phase-step.active .ps-label { color: #a78bfa; font-weight: 700; }
    .phase-step.done   .ps-dot  { background: #22c55e; }
    .phase-step.done   .ps-label { color: #4ade80; }
    .phase-connector {
      flex: 1;
      height: 1px;
      min-width: 8px;
      max-width: 36px;
      background: #2d3148;
      transition: background 0.3s;
      flex-shrink: 1;
    }
    .phase-connector.done { background: #22c55e; }

    /* ── Chat area ── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    #chat::-webkit-scrollbar { width: 6px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: #2d3148; border-radius: 3px; }

    .bubble-row {
      display: flex;
      gap: 10px;
      max-width: 780px;
      width: 100%;
    }
    .bubble-row.ai       { align-self: flex-start; }
    .bubble-row.user     { align-self: flex-end; flex-direction: row-reverse; }
    .bubble-row.feedback { align-self: center; width: 100%; max-width: 820px; }

    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 600;
    }
    .avatar.ai   { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; }
    .avatar.user { background: #1e3a5f; color: #93c5fd; }

    .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
      max-width: 100%;
    }
    .bubble-row.ai   .bubble { background: #1e2235; border-top-left-radius: 4px; }
    .bubble-row.user .bubble { background: #1e3a5f; border-top-right-radius: 4px; color: #bfdbfe; }

    .replay-btn {
      display: inline-flex; align-items: center; gap: 4px;
      margin-top: 6px; padding: 3px 8px;
      background: transparent; border: 1px solid #2d3148;
      border-radius: 12px; color: #64748b; font-size: 11px;
      cursor: pointer; transition: color .15s, border-color .15s;
    }
    .replay-btn:hover { color: #a78bfa; border-color: #a78bfa; }

    /* Markdown rendering inside bubbles */
    .bubble p, .feedback-card p { margin: 0 0 8px 0; }
    .bubble p:last-child, .feedback-card p:last-child { margin-bottom: 0; }
    .bubble strong, .feedback-card strong { color: #e2e8f0; }
    .bubble em, .feedback-card em { color: #94a3b8; font-style: italic; }
    .bubble ul, .bubble ol, .feedback-card ul, .feedback-card ol {
      margin: 6px 0 6px 18px; padding: 0;
    }
    .bubble li, .feedback-card li { margin-bottom: 4px; }
    .bubble hr, .feedback-card hr {
      border: none; border-top: 1px solid #2d3148; margin: 12px 0;
    }
    .bubble h1, .bubble h2, .bubble h3,
    .feedback-card h1, .feedback-card h2, .feedback-card h3 {
      color: #a78bfa; margin: 12px 0 6px 0; font-size: 14px;
    }
    .bubble code, .feedback-card code {
      background: #0f1117; border-radius: 4px;
      padding: 1px 5px; font-size: 12px; color: #7dd3fc;
    }

    /* Feedback card */
    .feedback-card {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
    }
    .feedback-card {
      font-size: 13px;
      line-height: 1.7;
      color: #94a3b8;
    }

    /* Typing indicator */
    .typing-indicator {
      display: flex; align-items: center; gap: 5px;
      padding: 12px 16px;
      background: #1e2235;
      border-radius: 16px;
      border-top-left-radius: 4px;
      width: fit-content;
    }
    .typing-indicator span {
      width: 7px; height: 7px;
      background: #6366f1;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: .5; }
      30%            { transform: translateY(-6px); opacity: 1; }
    }

    /* ── Input area ── */
    #input-area {
      padding: 16px;
      background: #1a1d27;
      border-top: 1px solid #2d3148;
      flex-shrink: 0;
    }
    #input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      max-width: 820px;
      margin: 0 auto;
    }
    #text-input {
      flex: 1;
      background: #0f1117;
      border: 1px solid #2d3148;
      border-radius: 12px;
      padding: 12px 16px;
      color: #e2e8f0;
      font-size: 14px;
      resize: none;
      outline: none;
      min-height: 48px;
      max-height: 140px;
      transition: border-color 0.2s;
      line-height: 1.5;
    }
    #text-input:focus    { border-color: #6366f1; }
    #text-input:disabled { opacity: 0.4; cursor: not-allowed; }
    #text-input::placeholder { color: #475569; }

    .icon-btn {
      width: 48px; height: 48px;
      border: none; border-radius: 12px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      font-size: 20px;
      transition: all 0.2s;
    }
    #mic-btn {
      background: #1e2235;
      color: #94a3b8;
    }
    #mic-btn:hover    { background: #2d3148; color: #e2e8f0; }
    #mic-btn.active   { background: #450a0a; color: #f87171; animation: pulse 1.5s infinite; }
    #mic-btn:disabled { opacity: 0.3; cursor: not-allowed; animation: none; }

    #send-btn {
      background: #6366f1;
      color: #fff;
    }
    #send-btn:hover    { background: #4f46e5; }
    #send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    #skip-btn {
      background: #2d3148;
      color: #94a3b8;
      display: none;
      font-size: 13px;
      font-weight: 600;
      width: auto;
      padding: 0 14px;
    }
    #skip-btn:hover { background: #3d4160; color: #e2e8f0; }

    #cancel-rec-btn {
      background: #2d3148;
      color: #f87171;
      display: none;
      font-size: 18px;
    }
    #cancel-rec-btn:hover { background: #3d4160; }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,.4); }
      50%       { box-shadow: 0 0 0 8px rgba(239,68,68,0); }
    }

    #hint {
      font-size: 11px;
      color: #475569;
      text-align: center;
      margin-top: 8px;
    }

    /* Done banner */
    #done-banner {
      display: none;
      text-align: center;
      padding: 12px;
      background: #14532d;
      color: #4ade80;
      font-size: 13px;
      font-weight: 500;
      border-radius: 8px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">🎤</div>
  <div>
    <h1>Mock Interview Simulator</h1>
    <p>Practice your tech interview in English</p>
  </div>
  <div id="status-badge">Connecting…</div>
</header>

<nav id="phase-bar">
  <div class="phase-steps">
    <div class="phase-step" data-step="0"><span class="ps-dot"></span><span class="ps-label">Elevator Pitch</span></div>
    <div class="phase-connector" data-conn="0"></div>
    <div class="phase-step" data-step="1"><span class="ps-dot"></span><span class="ps-label">CAR Story</span></div>
    <div class="phase-connector" data-conn="1"></div>
    <div class="phase-step" data-step="2"><span class="ps-dot"></span><span class="ps-label">Technical</span></div>
    <div class="phase-connector" data-conn="2"></div>
    <div class="phase-step" data-step="3"><span class="ps-dot"></span><span class="ps-label">Leadership</span></div>
    <div class="phase-connector" data-conn="3"></div>
    <div class="phase-step" data-step="4"><span class="ps-dot"></span><span class="ps-label">Motivation</span></div>
    <div class="phase-connector" data-conn="4"></div>
    <div class="phase-step" data-step="5"><span class="ps-dot"></span><span class="ps-label">Your Questions</span></div>
    <div class="phase-connector" data-conn="5"></div>
    <div class="phase-step" data-step="6"><span class="ps-dot"></span><span class="ps-label">Scorecard</span></div>
  </div>
</nav>

<div id="chat"></div>

<div id="input-area">
  <div id="done-banner">Interview complete — check your feedback above!</div>
  <div id="input-row">
    <button id="mic-btn" class="icon-btn" disabled title="Click to start/stop recording">🎙️</button>
    <button id="cancel-rec-btn" class="icon-btn" title="Cancel recording">✕</button>
    <textarea id="text-input" placeholder="Type your answer or press 🎙️ to speak…"
              rows="1" disabled></textarea>
    <button id="skip-btn" class="icon-btn" title="Skip audio">⏭ Skip</button>
    <button id="send-btn" class="icon-btn" disabled title="Send (Enter)">➤</button>
  </div>
  <p id="hint">Click <strong>🎙️</strong> to start/stop recording · <strong>Enter</strong> to send text · <strong>Shift+Enter</strong> for new line</p>
</div>

<script>
  // ── Phase progress bar ───────────────────────────────────────────────
  const FASE_TO_STEP = {
    elevator_pitch:        0,
    elevator_pitch_report: 0,
    CAR:                   1,
    CAR_report:            1,
    technical:             2,
    technical_report:      2,
    leadership:            3,
    leadership_report:     3,
    motivation:            4,
    motivation_report:     4,
    marcio_questions:      5,
    feedback:              6,
    done:                  6,
  };
  const phaseSteps = document.querySelectorAll('.phase-step');
  const phaseConns = document.querySelectorAll('.phase-connector');

  function setPhase(fase) {
    const active = FASE_TO_STEP[fase] ?? -1;
    phaseSteps.forEach((el) => {
      const s = parseInt(el.dataset.step, 10);
      el.classList.toggle('active', s === active);
      el.classList.toggle('done',   s < active);
    });
    phaseConns.forEach((el) => {
      const c = parseInt(el.dataset.conn, 10);
      el.classList.toggle('done', c < active);
    });
    // Scroll the active step into view on small screens
    const activeEl = document.querySelector('.phase-step.active');
    if (activeEl) activeEl.scrollIntoView({ inline: 'center', behavior: 'smooth' });
  }

  const chat         = document.getElementById('chat');
  const input        = document.getElementById('text-input');
  const micBtn       = document.getElementById('mic-btn');
  const cancelRecBtn = document.getElementById('cancel-rec-btn');
  const sendBtn      = document.getElementById('send-btn');
  const skipBtn      = document.getElementById('skip-btn');
  const badge        = document.getElementById('status-badge');
  const doneBanner   = document.getElementById('done-banner');

  let ws = null;
  let mediaRecorder = null;
  let audioChunks = [];
  let typingEl = null;
  let currentAudio = null;

  // Streaming state
  let streamBubbleEl  = null;   // the growing bubble element during streaming
  let streamWrapperEl = null;   // flex column wrapper that holds bubble + replay btn
  let streamRawText  = '';     // full raw text accumulated so far (for bubble rendering)
  let streamTTSBuf   = '';     // text not yet dispatched to TTS
  let streamVoice    = 'nova'; // TTS voice for the current streaming session

  // ── Mobile audio unlock ──────────────────────────────────────────────
  // iOS and Android block autoplay until after a user gesture.
  // Desktop browsers allow autoplay freely, so we start unlocked there.
  // On touch devices we queue any speech that fires before the first
  // interaction and flush it the moment the user taps/clicks anything.
  const _isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
  let audioUnlocked  = !_isTouchDevice;
  let pendingSpeakArgs = null;   // {text, voice} waiting for unlock

  function _unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    // Remove the tap-to-start overlay if present
    const overlay = document.getElementById('tap-overlay');
    if (overlay) overlay.remove();
    // Play whatever was queued before the first gesture
    if (pendingSpeakArgs) {
      const { text, voice } = pendingSpeakArgs;
      pendingSpeakArgs = null;
      speak(text, voice);
    }
  }
  document.addEventListener('click',      _unlockAudio, { capture: true });
  document.addEventListener('touchstart', _unlockAudio, { capture: true });
  document.addEventListener('keydown',    _unlockAudio, { capture: true });

  // ── TTS — chunked parallel fetch, sequential playback ────────────────
  // Strategy: split text into sentence-sized chunks, fire ALL fetches
  // immediately in parallel, then play chunks in order via a promise chain.
  // Result: first chunk starts playing in ~0.5s; rest arrive while it plays.

  let ttsChain = Promise.resolve();
  let ttsToken  = 0;   // incremented on stopTTS/new speak to cancel in-flight chunks
  let ttsActiveSpeaks = 0;  // counts concurrent speak() calls; button hides only when 0

  function _stripMarkdown(text) {
    return text
      .replace(/\*\*(.*?)\*\*/g, '$1')
      .replace(/\*(.*?)\*/g, '$1')
      .replace(/#{1,6}\s+/g, '')
      .replace(/---+/g, '. ')
      .replace(/^\s*[-*•]\s+/gm, '')
      .replace(/`([^`]+)`/g, '$1')
      .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
      .replace(/\n{2,}/g, '. ')
      .replace(/\n/g, ' ')
      .replace(/\s{2,}/g, ' ')
      .trim();
  }

  function _splitChunks(text) {
    const plain = _stripMarkdown(text);
    // Split on sentence-ending punctuation followed by whitespace
    const parts = plain.split(/(?<=[.!?:])\s+/).filter(p => p.trim().length > 0);
    // Merge very short parts so we don't make dozens of tiny API calls
    const chunks = [];
    let current = '';
    for (const part of parts) {
      const merged = current ? current + ' ' + part : part;
      if (merged.length <= 220) { current = merged; }
      else { if (current) chunks.push(current); current = part; }
    }
    if (current) chunks.push(current);
    return chunks.length > 0 ? chunks : [plain];
  }

  async function _fetchAudioUrl(text, voice = 'nova') {
    try {
      const res = await fetch(`/tts?text=${encodeURIComponent(text)}&voice=${voice}`);
      if (!res.ok) return null;
      return URL.createObjectURL(await res.blob());
    } catch { return null; }
  }

  function speak(text, voice = 'nova') {
    // On mobile, audio is blocked until after a user gesture.
    // Queue the most recent speak() call and play it once unlocked.
    if (!audioUnlocked) {
      pendingSpeakArgs = { text, voice };
      return ttsChain;   // caller gets the existing (resolved) chain
    }

    const myToken = ttsToken;   // read current token — only stopTTS() increments it
    const chunks  = _splitChunks(text);

    // Fire ALL fetches NOW in parallel — they complete while earlier chunks play
    const fetches = chunks.map(c => _fetchAudioUrl(c, voice));
    skipBtn.style.display = 'flex';
    ttsActiveSpeaks++;

    for (let i = 0; i < chunks.length; i++) {
      const fetch_i = fetches[i];
      const isLast  = i === chunks.length - 1;

      ttsChain = ttsChain.then(async () => {
        if (ttsToken !== myToken) return;          // aborted by skip / newer speak
        const url = await fetch_i;
        if (ttsToken !== myToken || !url) { if (url) URL.revokeObjectURL(url); return; }

        const audio = new Audio(url);
        currentAudio = audio;
        await new Promise(r => { audio.onended = r; audio.onerror = r; audio.play().catch(r); });
        URL.revokeObjectURL(url);
        currentAudio = null;
        if (isLast && ttsToken === myToken) {
          ttsActiveSpeaks = Math.max(0, ttsActiveSpeaks - 1);
          if (ttsActiveSpeaks === 0) skipBtn.style.display = 'none';
        }
      }).catch(() => {});
    }

    return ttsChain;   // caller can .then() — resolves when last chunk finishes
  }

  function stopTTS() {
    ttsToken++;                                    // invalidates all queued chunks
    ttsActiveSpeaks = 0;
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    ttsChain = Promise.resolve();
    skipBtn.style.display = 'none';
  }

  // ── Disconnection beep ───────────────────────────────────────────────
  // Two short descending tones played via Web Audio API — no file needed.
  function playDisconnectBeep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [[440, 0.00], [330, 0.18]].forEach(([freq, start]) => {
        const osc  = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.4, ctx.currentTime + start);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + 0.15);
        osc.start(ctx.currentTime + start);
        osc.stop(ctx.currentTime + start + 0.15);
      });
    } catch (_) {}
  }

  // ── Skip TTS ──────────────────────────────────────────────────────────
  skipBtn.addEventListener('click', () => {
    stopTTS();
    enableInput();
  });

  // ── Streaming helpers ────────────────────────────────────────────────

  function _drainStreamTTS(flush) {
    // Extract complete sentences from streamTTSBuf and speak them.
    // If flush=true, speak whatever remains even without sentence-end punctuation.
    const parts = streamTTSBuf.split(/(?<=[.!?:])\s+/);
    if (parts.length > 1) {
      for (let i = 0; i < parts.length - 1; i++) {
        const s = _stripMarkdown(parts[i]).trim();
        if (s) speak(s, streamVoice);
      }
      streamTTSBuf = parts[parts.length - 1];
    }
    if (flush && streamTTSBuf.trim()) {
      speak(_stripMarkdown(streamTTSBuf).trim(), streamVoice);
      streamTTSBuf = '';
    }
  }

  function _appendStreamChunk(text, voice = 'nova') {
    streamVoice   = voice;   // all chunks in a session share the same voice
    streamRawText += text;
    streamTTSBuf  += text;

    // Create bubble on first chunk
    if (!streamBubbleEl) {
      removeTyping();
      const row = document.createElement('div');
      row.className = 'bubble-row ai';
      const avatar = document.createElement('div');
      avatar.className = 'avatar ai';
      avatar.textContent = 'I';
      streamWrapperEl = document.createElement('div');
      streamWrapperEl.style.display = 'flex';
      streamWrapperEl.style.flexDirection = 'column';
      streamWrapperEl.style.alignItems = 'flex-start';
      streamBubbleEl = document.createElement('div');
      streamBubbleEl.className = 'bubble';
      streamWrapperEl.appendChild(streamBubbleEl);
      row.appendChild(avatar);
      row.appendChild(streamWrapperEl);
      chat.appendChild(row);
    }

    // Update bubble with formatted markdown
    streamBubbleEl.innerHTML = renderMd(streamRawText);
    scrollBottom();

    // Speak complete sentences as they arrive
    _drainStreamTTS(false);
  }

  function _finalizeStream() {
    _drainStreamTTS(true);   // flush any remaining text

    // Add replay button now that the full text is known
    if (streamWrapperEl && streamRawText) {
      const finalText  = streamRawText;
      const finalVoice = streamVoice;   // capture before reset
      const btn = document.createElement('button');
      btn.className = 'replay-btn';
      btn.innerHTML = '🔊 replay';
      btn.title = 'Replay audio';
      btn.addEventListener('click', () => {
        stopTTS();
        speak(_stripMarkdown(finalText), finalVoice);
      });
      streamWrapperEl.appendChild(btn);
    }

    streamBubbleEl  = null;
    streamWrapperEl = null;
    streamRawText   = '';
    streamTTSBuf    = '';
    streamVoice     = 'nova';  // reset to default for next streaming session
  }

  // ── STT via MediaRecorder + Whisper ──────────────────────────────────
  // Records raw audio while button is held; transcribes on release via Whisper.
  // No silence detection — full control over start/stop.

  async function startRecording() {
    if (micBtn.disabled) return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioChunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.start();

      micBtn.classList.add('active');
      cancelRecBtn.style.display = 'flex';
      badge.textContent = '🔴 Recording';
      badge.className = 'recording';
      input.placeholder = 'Recording… click 🎙️ to send or ✕ to cancel';
      input.value = '';
    } catch (err) {
      console.error('Mic error:', err);
    }
  }

  function _stopMediaRecorder() {
    if (!mediaRecorder || mediaRecorder.state === 'inactive') return;
    mediaRecorder.stop();
    mediaRecorder.stream.getTracks().forEach(t => t.stop());
    micBtn.classList.remove('active');
    cancelRecBtn.style.display = 'none';
  }

  function cancelRecording() {
    if (!mediaRecorder || mediaRecorder.state === 'inactive') return;
    // Mark as cancelled so the 'stop' handler discards the data
    mediaRecorder._cancelled = true;
    _stopMediaRecorder();
    badge.textContent = 'Connected';
    badge.className = 'connected';
    input.placeholder = 'Type or hold 🎙️ to speak…';
  }

  async function stopRecording() {
    if (!mediaRecorder || mediaRecorder.state === 'inactive') return;

    _stopMediaRecorder();
    badge.textContent = 'Transcribing…';
    badge.className = 'processing';
    input.placeholder = 'Transcribing…';

    // Wait for the final dataavailable event before reading chunks
    await new Promise(r => mediaRecorder.addEventListener('stop', r, { once: true }));

    // Discard if the recording was cancelled
    if (mediaRecorder._cancelled) {
      mediaRecorder._cancelled = false;
      return;
    }

    const blob = new Blob(audioChunks, { type: 'audio/webm' });
    const form = new FormData();
    form.append('audio', blob, 'recording.webm');

    try {
      const res  = await fetch('/stt', { method: 'POST', body: form });
      const data = await res.json();
      input.value = data.text || '';
      autoResize();
      badge.textContent = 'Connected';
      badge.className = 'connected';
      input.placeholder = 'Type or hold 🎙️ to speak…';
      if (input.value.trim()) sendMessage();
    } catch (err) {
      console.error('STT error:', err);
      badge.textContent = 'Connected';
      badge.className = 'connected';
      input.placeholder = 'Type or hold 🎙️ to speak…';
    }
  }

  // ── WebSocket ─────────────────────────────────────────────────────────
  let pingInterval = null;

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws`);

    ws.onopen = () => {
      badge.textContent = 'Connected';
      badge.className = 'connected';
      // Send a ping every 25 s to keep the connection alive through proxies
      // that close idle WebSocket connections at 60–120 s.
      clearInterval(pingInterval);
      pingInterval = setInterval(() => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'ping' }));
        }
      }, 25_000);
    };

    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      removeTyping();

      switch (msg.type) {
        case 'phase':
          setPhase(msg.fase);
          break;

        case 'stream_chunk':
          _appendStreamChunk(msg.text, msg.voice || 'nova');
          break;

        case 'stream_done':
          _finalizeStream();
          break;

        case 'await_input':
          // Streaming already showed the bubble — wait for TTS chain to drain, then enable input
          ttsChain.then(() => enableInput());
          break;

        case 'phase_question':
          // First question of a new phase. Stop any ongoing TTS (transition feedback)
          // immediately so the new question appears cleanly, then enable input only
          // after the question finishes speaking.
          stopTTS();
          addBubble('ai', msg.text);
          speak(msg.text).then(() => enableInput());
          break;

        case 'ai':
          addBubble('ai', msg.text);
          // Speak question, then enable input so user can't interrupt mid-sentence
          speak(msg.text).then(() => enableInput());
          break;

        case 'transition':
          addBubble('ai', msg.text, 'onyx');
          speak(msg.text, 'onyx');     // fire-and-forget — graph keeps running in parallel
          showTyping(true);
          break;

        case 'user':
          // Echoed back from server — already shown optimistically, ignore
          break;

        case 'feedback':
          addFeedback(msg.text);
          break;

        case 'error':
          addBubble('ai', '⚠️ ' + msg.text);
          disableInput(true);
          badge.textContent = 'Error';
          badge.className = '';
          break;

        case 'done':
          doneBanner.style.display = 'block';
          disableInput(true);
          badge.textContent = 'Done';
          badge.className = '';
          break;
      }
    };

    ws.onclose = (e) => {
      clearInterval(pingInterval);
      // Code 1000 = clean close (interview finished normally) — don't reconnect.
      if (e.code === 1000) {
        badge.textContent = 'Done';
        badge.className = '';
        return;
      }
      playDisconnectBeep();
      badge.textContent = 'Reconnecting…';
      badge.className = '';
      disableInput(true);
      // Wait 2 s then try again so we don't hammer the server.
      setTimeout(connect, 2000);
    };

    ws.onerror = () => {
      badge.textContent = 'Error';
      badge.className = '';
      // onclose fires right after onerror — reconnect logic runs there.
    };
  }

  // ── UI helpers ────────────────────────────────────────────────────────
  function renderMd(text) {
    return marked.parse(text, { breaks: true });
  }

  function addBubble(role, text, voice = 'nova') {
    const row = document.createElement('div');
    row.className = `bubble-row ${role}`;

    const avatar = document.createElement('div');
    avatar.className = `avatar ${role}`;
    avatar.textContent = role === 'ai' ? 'I' : 'Y';

    const wrapper = document.createElement('div');
    wrapper.style.display = 'flex';
    wrapper.style.flexDirection = 'column';
    wrapper.style.alignItems = 'flex-start';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = renderMd(text);
    wrapper.appendChild(bubble);

    if (role === 'ai') {
      const btn = document.createElement('button');
      btn.className = 'replay-btn';
      btn.innerHTML = '🔊 replay';
      btn.title = 'Replay audio';
      btn.addEventListener('click', () => {
        stopTTS();
        speak(_stripMarkdown(text), voice);
      });
      wrapper.appendChild(btn);
    }

    row.appendChild(avatar);
    row.appendChild(wrapper);
    chat.appendChild(row);
    scrollBottom();
  }

  function addFeedback(text) {
    const row = document.createElement('div');
    row.className = 'bubble-row feedback';

    const cardWrapper = document.createElement('div');
    cardWrapper.style.display = 'flex';
    cardWrapper.style.flexDirection = 'column';
    cardWrapper.style.alignItems = 'flex-start';
    cardWrapper.style.width = '100%';

    const card = document.createElement('div');
    card.className = 'feedback-card';
    card.innerHTML = renderMd(text);
    cardWrapper.appendChild(card);

    const btn = document.createElement('button');
    btn.className = 'replay-btn';
    btn.innerHTML = '🔊 replay';
    btn.title = 'Replay audio';
    btn.addEventListener('click', () => {
      stopTTS();
      speak(_stripMarkdown(text), 'onyx');
    });
    cardWrapper.appendChild(btn);

    row.appendChild(cardWrapper);
    chat.appendChild(row);
    scrollBottom();

    // Speak feedback automatically with male Judge voice
    speak(_stripMarkdown(text), 'onyx');
  }

  function showTyping(visible) {
    if (!visible) return;
    if (typingEl) return;

    const row = document.createElement('div');
    row.className = 'bubble-row ai';
    row.id = 'typing-row';

    const avatar = document.createElement('div');
    avatar.className = 'avatar ai';
    avatar.textContent = 'I';

    const indicator = document.createElement('div');
    indicator.className = 'typing-indicator';
    indicator.innerHTML = '<span></span><span></span><span></span>';

    row.appendChild(avatar);
    row.appendChild(indicator);
    chat.appendChild(row);
    typingEl = row;
    scrollBottom();
  }

  function removeTyping() {
    if (typingEl) { typingEl.remove(); typingEl = null; }
  }

  function scrollBottom() {
    chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
  }

  function enableInput() {
    input.disabled = false;
    sendBtn.disabled = false;
    micBtn.disabled = false;
    input.focus();
    badge.textContent = 'Connected';
    badge.className = 'connected';
  }

  function disableInput(permanent = false) {
    input.disabled = true;
    sendBtn.disabled = true;
    micBtn.disabled = true;
    if (!permanent) {
      badge.textContent = 'Processing…';
      badge.className = 'processing';
    }
  }

  function autoResize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  }

  // ── Send ──────────────────────────────────────────────────────────────
  function sendMessage() {
    const text = input.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

    addBubble('user', text);
    ws.send(JSON.stringify({ text }));
    input.value = '';
    input.style.height = 'auto';
    disableInput();
    showTyping(true);
  }

  // ── Events ────────────────────────────────────────────────────────────
  sendBtn.addEventListener('click', sendMessage);

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  input.addEventListener('input', autoResize);

  // Toggle recording — click once to start, click again to stop.
  micBtn.addEventListener('click', () => {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      stopRecording();
    } else {
      startRecording();
    }
  });

  cancelRecBtn.addEventListener('click', cancelRecording);

  // ── Boot ──────────────────────────────────────────────────────────────
  connect();
  showTyping(true);   // waiting for first AI message

  // Show a "tap to enable audio" overlay on touch devices.
  // Removed automatically on first tap by _unlockAudio().
  if (_isTouchDevice) {
    const overlay = document.createElement('div');
    overlay.id = 'tap-overlay';
    overlay.style.cssText = [
      'position:fixed', 'inset:0', 'z-index:9999',
      'display:flex', 'align-items:flex-end', 'justify-content:center',
      'padding-bottom:32px', 'pointer-events:none',
    ].join(';');
    const pill = document.createElement('div');
    pill.style.cssText = [
      'background:rgba(0,0,0,0.65)', 'color:#fff',
      'font-size:13px', 'padding:8px 20px', 'border-radius:99px',
      'backdrop-filter:blur(6px)', '-webkit-backdrop-filter:blur(6px)',
    ].join(';');
    pill.textContent = 'Tap anywhere to enable audio';
    overlay.appendChild(pill);
    document.body.appendChild(overlay);
  }
</script>
</body>
</html>
