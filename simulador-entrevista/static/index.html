<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mock Interview Simulator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      padding: 14px 24px;
      background: #1a1d27;
      border-bottom: 1px solid #2d3148;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    header h1 { font-size: 16px; font-weight: 600; color: #f1f5f9; }
    header p  { font-size: 12px; color: #64748b; margin-top: 1px; }
    .home-link {
      display: flex; align-items: center; gap: 12px;
      text-decoration: none; color: inherit;
      border-radius: 10px; padding: 2px 6px; margin: -2px -6px;
      transition: background 0.2s;
    }
    .home-link:hover { background: rgba(99,102,241,0.08); }

    /* ── Main content ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      gap: 48px;
    }

    /* ── Hero ── */
    .hero {
      text-align: center;
      max-width: 520px;
    }
    .hero-icon {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px;
      margin: 0 auto 20px;
    }
    .hero h2 {
      font-size: 26px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 10px;
    }
    .hero p {
      font-size: 15px;
      color: #64748b;
      line-height: 1.6;
    }

    /* ── Action cards ── */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 440px;
    }

    .action-card {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 18px;
      padding: 22px 24px;
      display: flex;
      align-items: center;
      gap: 18px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
    }
    .action-card:hover {
      border-color: #6366f1;
      background: #1e2235;
      transform: translateY(-1px);
    }
    .action-card.primary {
      border-color: #4f46e5;
      background: #1e1b4b;
    }
    .action-card.primary:hover {
      background: #25226a;
      border-color: #818cf8;
    }
    .action-card.continue-card {
      border-color: #065f46;
      background: #052e1c;
    }
    .action-card.continue-card:hover {
      background: #064e38;
      border-color: #34d399;
    }

    .card-icon {
      width: 48px; height: 48px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }
    .primary   .card-icon { background: #312e81; }
    .secondary .card-icon { background: #1e2235; }
    .continue-card .card-icon { background: #064e38; }

    .card-body { flex: 1; min-width: 0; }
    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 3px;
    }
    .card-sub {
      font-size: 12px;
      color: #64748b;
      line-height: 1.4;
    }
    .continue-card .card-sub { color: #6ee7b7; }

    .card-arrow {
      font-size: 18px;
      color: #475569;
      flex-shrink: 0;
    }
    .primary       .card-arrow { color: #a5b4fc; }
    .continue-card .card-arrow { color: #6ee7b7; }

    /* ── Footer ── */
    footer {
      padding: 16px;
      text-align: center;
      font-size: 11px;
      color: #334155;
    }
  </style>
</head>
<body>

<header>
  <a class="home-link" href="/">
    <div class="logo">🎤</div>
    <div>
      <h1>Mock Interview Simulator</h1>
      <p>Practice your tech interview in English</p>
    </div>
  </a>
</header>

<main>
  <div class="hero">
    <div class="hero-icon">🎤</div>
    <h2>Ready to practice?</h2>
    <p>Sharpen your interview skills with an AI-powered mock interview. Get real-time feedback on your Elevator Pitch, CAR stories, technical depth, and more.</p>
  </div>

  <div class="actions" id="actions">
    <!-- Cards injected by JS so the "Continue" card can be shown conditionally -->
  </div>
</main>

<footer>Powered by Claude + Whisper + OpenAI TTS</footer>

<script>
  const SESSION_KEY = 'interview_v1';
  const SESSION_TTL = 48 * 60 * 60 * 1000;

  const FASE_LABEL = {
    elevator_pitch:        'Elevator Pitch',
    elevator_pitch_report: 'Elevator Pitch — review',
    CAR:                   'CAR Story',
    CAR_report:            'CAR Story — review',
    technical:             'Technical Questions',
    technical_report:      'Technical — review',
    leadership:            'Leadership Questions',
    leadership_report:     'Leadership — review',
    motivation:            'Motivation Questions',
    motivation_report:     'Motivation — review',
    marcio_questions:      'Your Questions',
    feedback:              'Final Scorecard',
    done:                  'Completed',
  };

  function _loadRaw() {
    try {
      const d = JSON.parse(localStorage.getItem(SESSION_KEY));
      if (!d) return null;
      if (Date.now() - d.savedAt > SESSION_TTL) { localStorage.removeItem(SESSION_KEY); return null; }
      return d;
    } catch { return null; }
  }

  function _fmt(ts) {
    if (!ts) return '';
    const d   = new Date(ts);
    const now = new Date();
    const diffDays = Math.floor((now - d) / 86400000);
    const time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    if (diffDays === 0) return `Today at ${time}`;
    if (diffDays === 1) return `Yesterday at ${time}`;
    return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ` at ${time}`;
  }

  function startNew() {
    localStorage.removeItem(SESSION_KEY);
    window.location.href = '/interview.html';
  }

  function continueSession() {
    // SESSION_KEY already has the active session — interview.html will resume it.
    window.location.href = '/interview.html';
  }

  function render() {
    const actionsEl = document.getElementById('actions');
    const raw = _loadRaw();

    let html = '';

    // "Continue" card — only when there's a non-completed active session
    if (raw?.threadId && raw.fase !== 'done') {
      const phase = FASE_LABEL[raw.fase] || (raw.fase ? raw.fase : 'Starting…');
      const when  = _fmt(raw.savedAt);
      html += `
        <div class="action-card continue-card" onclick="continueSession()">
          <div class="card-icon">▶️</div>
          <div class="card-body">
            <div class="card-title">Continue interview</div>
            <div class="card-sub">${phase}${when ? ' · ' + when : ''}</div>
          </div>
          <span class="card-arrow">›</span>
        </div>`;
    }

    html += `
      <div class="action-card primary" onclick="startNew()">
        <div class="card-icon">✨</div>
        <div class="card-body">
          <div class="card-title">New interview</div>
          <div class="card-sub">Start a fresh session from the beginning</div>
        </div>
        <span class="card-arrow">›</span>
      </div>

      <a class="action-card secondary" href="/history.html">
        <div class="card-icon">📋</div>
        <div class="card-body">
          <div class="card-title">Interview history</div>
          <div class="card-sub">Browse and continue past sessions</div>
        </div>
        <span class="card-arrow">›</span>
      </a>`;

    actionsEl.innerHTML = html;
  }

  render();
</script>
</body>
</html>
